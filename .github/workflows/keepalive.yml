name: Keep Supabase awake

on:
  schedule:
    - cron: "0 1 * * *"   # every day at 01:00 UTC (08:00 Phnom Penh)
  workflow_dispatch:        # allows manual run for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl --fail --silent --show-error \
            "https://ovexgpkrljrbfhtsuxyg.supabase.co/rest/v1/lead_stages?select=stage_code&limit=1" \
            -H "apikey: sb_publishable_csDL72Yg5kcrGayuqC6QzA_4c7iNOaL" \
            -H "Authorization: Bearer sb_publishable_csDL72Yg5kcrGayuqC6QzA_4c7iNOaL" \
            && echo "Supabase is awake."
