<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="geo.js"></script>
<style>
:root{
  /* warm neutral paper, one clay accent */
  --ink:#191919; --ink-soft:#6b6862; --line:#e0dcd1;
  --paper:#f0eee6; --card:#faf9f5; --card-alt:#f5f3ec;
  --sun:#cc785c; --sun-deep:#a85841; --sun-press:#8f4835; --sky:#3d6376;
  --ok:#2f6b41; --bad:#a8412f; --warn:#86601f;
  --pool:#6c4f7b; --eng:#4a7c8c;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);font-size:15px}
h1,h2,h3,.brand{font-family:'Source Serif 4',Georgia,serif;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
input:disabled,select:disabled,textarea:disabled{background:#edeae1;color:#9a958a}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sun);outline-offset:1px;border-color:var(--sun)}
label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}

#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#191919 0%,#2e2823 55%,#5a4739 100%)}
.login-card{background:var(--card);padding:36px 32px;border-radius:16px;width:360px;max-width:92vw;
  box-shadow:0 18px 50px rgba(25,20,15,.45)}
.sunmark{width:46px;height:46px;border-radius:50%;margin-bottom:14px;
  background:radial-gradient(circle at 35% 35%, #e9a98d, var(--sun) 55%, var(--sun-deep));
  box-shadow:0 0 0 6px rgba(204,120,92,.18), 0 0 24px rgba(204,120,92,.45)}
.login-card h1{font-size:22px;margin-bottom:2px}
.login-card p{color:var(--ink-soft);font-size:13px;margin-bottom:12px}
.btn-primary{background:var(--sun-deep);color:#fff;font-weight:600;padding:11px 16px;width:100%;margin-top:16px}
.btn-primary:hover{background:var(--sun-press)}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}

#app-view{display:none;min-height:100vh}
header{background:var(--ink);color:#fff;padding:0 18px;display:flex;align-items:center;gap:18px;height:54px;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px}
.brand .dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e9a98d,var(--sun))}
nav{display:flex;gap:4px;flex:1}
nav button{background:transparent;color:#c4bfb5;padding:8px 12px;border-radius:8px;font-weight:600}
nav button.active{background:rgba(204,120,92,.22);color:#e9a98d}
nav button:hover{color:#fff}
.who{font-size:12px;color:#a8a297;text-align:right;line-height:1.3}
.who b{color:#fff;display:block;font-size:13px}
.btn-ghost{background:transparent;color:#c4bfb5;border:1px solid #4a443c;padding:7px 12px}
.btn-ghost:hover{color:#fff;border-color:#fff}
main{max-width:1240px;margin:0 auto;padding:22px 18px 60px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{width:auto;min-width:150px}
.spacer{flex:1}
.btn-sun{background:var(--sun-deep);color:#fff;font-weight:600;padding:10px 16px}
.btn-sun:hover{background:var(--sun-press)}
.btn-line{background:#fff;border:1px solid var(--line);color:var(--ink);padding:10px 14px;font-weight:600}
.btn-line:hover{border-color:var(--ink)}
.btn-danger{background:#fff;border:1px solid var(--bad);color:var(--bad);padding:10px 14px;font-weight:600}
.btn-danger:hover{background:var(--bad);color:#fff}

.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);background:var(--card-alt);position:sticky;top:0}
td{padding:11px 12px;border-bottom:1px solid #ebe7dc;font-size:14px;vertical-align:middle}
tr.rowlink{cursor:pointer}
tr.rowlink:hover{background:#f3ede4}
.stagepill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.days{font-size:11px;color:var(--ink-soft);display:block;margin-top:2px}
.pooltag{color:var(--pool);font-weight:700;font-size:12px}
.refid{font-size:12px;color:var(--ink-soft);font-family:monospace}
.overdue{color:var(--bad);font-weight:700}
.empty{padding:40px;text-align:center;color:var(--ink-soft)}

.overlay{position:fixed;inset:0;background:rgba(25,20,15,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:14px;width:880px;max-width:100%;padding:24px;box-shadow:0 24px 70px rgba(25,20,15,.45)}
.modal h2{font-size:19px;margin-bottom:4px}
.modal .sub{color:var(--ink-soft);font-size:13px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:680px){.grid2,.grid3{grid-template-columns:1fr}}
.modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.section{border:1px solid var(--line);border-radius:var(--r);padding:4px 16px 14px;margin-top:14px}
.section h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 2px;font-family:'Inter',sans-serif;font-weight:600}
.sec-sales h4{color:var(--sun-deep)} .sec-eng h4{color:var(--eng)} .sec-addr h4{color:var(--ink-soft)}

.timeline{border-left:2px solid var(--line);margin:14px 0 0 8px;padding-left:18px}
.tl-item{position:relative;padding-bottom:14px}
.tl-item::before{content:"";position:absolute;left:-24px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--sun);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tl-item .t-head{font-size:13px;font-weight:600}
.tl-item .t-meta{font-size:11px;color:var(--ink-soft)}
.tl-item .t-note{font-size:13px;margin-top:3px;white-space:pre-wrap}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .n{font-family:'Source Serif 4',Georgia,serif;font-size:28px;font-weight:600}
.stat .l{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.stat.gold{border-top:3px solid var(--sun)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;display:none;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.b-on{background:#dde8de;color:var(--ok)} .b-off{background:#f0ddd9;color:var(--bad)}
.hint{background:#f7efe3;border:1px solid #e0cfb4;border-radius:var(--r);padding:12px 14px;font-size:13px;color:#6b5537;margin-bottom:14px}
.chartcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 10px;margin-bottom:18px}
.chartcard h3{font-size:15px;margin-bottom:2px}
.chartcard .cap{font-size:12px;color:var(--ink-soft);margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--ink-soft)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.chartsvg{width:100%;height:auto;display:block}
.chartsvg text{font-family:'Inter',sans-serif}
.tick{font-size:10px;fill:var(--ink-soft);font-variant-numeric:tabular-nums}
.seglabel{font-size:10px;font-weight:600;fill:#fff;font-variant-numeric:tabular-nums}
.qcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px;background:var(--card-alt)}
.qcard b{font-family:'Source Serif 4',Georgia,serif}
@media(max-width:700px){ nav{overflow-x:auto} .who{display:none} }
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <div class="sunmark"></div>
    <h1>Solar CRM</h1>
    <p>Sign in with your staff account</p>
    <label>Email</label>
    <input id="li-email" type="email" autocomplete="username">
    <label>Password</label>
    <input id="li-pass" type="password" autocomplete="current-password">
    <button class="btn-primary" id="li-btn" onclick="doLogin()">Sign in</button>
    <div class="err" id="li-err"></div>
  </div>
</div>

<div id="app-view">
  <header>
    <div class="brand"><span class="dot"></span>Solar CRM</div>
    <nav id="nav"></nav>
    <div class="who" id="who"></div>
    <button class="btn-ghost" onclick="doLogout()">Sign out</button>
  </header>
  <main id="main"></main>
</div>

<div class="overlay" id="lead-overlay"><div class="modal" id="lead-modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   SOLAR CRM — frontend v2 (Phase 1)
   ============================================================ */
const sb = supabase.createClient(CRM_CONFIG.SUPABASE_URL, CRM_CONFIG.SUPABASE_ANON_KEY);

let ME=null, STAGES=[], STAFF=[], LEADS=[], QUOTS=[], COMMS=[], VIEW='leads';
/* the Leads tab shows only live work; won and lost have their own tabs */
let LEADSCOPE='active';
let FILTER={stage:'',q:'',qual:''};
let QFILTER={q:'',month:'',date:''};
/* local YYYY-MM-DD, so a late-evening lead in Cambodia isn't filed under tomorrow */
const localDay=d=>d?new Date(d).toLocaleDateString('sv'):'';
const monthName=m=>{const[y,mo]=m.split('-');return new Date(y,mo-1,1).toLocaleDateString('en-GB',{month:'short',year:'numeric'});};

/* Vocabularies from the client's Excel (Drop Down List sheet) */
const CHANNELS = {
  'Digital_Marketing': ['Facebook','Telegram','Tik Tok','Call','Walk-In'],
  'Third_Party':       ['Staff','Non-Staff'],
  'Direct_Sales':      [],   /* filled from the active sales staff at render time */
  'Offline_Marketing': ['Ground Activation']
};
const ROOF_TYPES = ['RC Roof/Awning','Zinc Roof','Tile Roof','Ground Mount','Other'];
const SYSTEM_TYPES = ['On-Grid','Hybrid','Off-Grid'];
const PHASE_TYPES = ['10A x 1P','20A x 1P','32A x 1P','63A x 1P','32A x 3P','40A x 3P','63A x 3P','100A x 3P'];
const CUSTOMER_TYPES = ['Residential','C & I'];
const PANEL_BRANDS = ['Jinko','LONGi','Trina','JA Solar','Canadian Solar','Other'];
const INVERTER_BRANDS = ['Deye','Growatt','Huawei','Sungrow','Solis','Other'];
const BATTERY_BRANDS = ['Deye','BYD','Pylontech','Growatt','Other'];

/* Cambodia geography comes from geo.js (NCDD official gazetteer):
   25 provinces, every district, every commune. */
const GEO = CRM_GEO;
const PROVINCES = Object.keys(GEO);

const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney=v=>v==null||v===''?'—':'$'+Number(v).toLocaleString(undefined,{maximumFractionDigits:2});
const fmtDate=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fmtDT=d=>d?new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const daysIn=d=>Math.floor((Date.now()-new Date(d).getTime())/86400000);
const staffName=id=>(STAFF.find(s=>s.id===id)||{}).full_name||'—';
const opt=(v,cur)=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`;
const optList=(arr,cur,blank=true)=>(blank?`<option value="">—</option>`:'')+arr.map(v=>opt(v,cur)).join('');
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600);}

/* warm pills; follow_up is deliberately coral and quotation_sent gold so
   the two neighbouring stages don't blur together in a long list */
const STAGE_COLORS={info_gathering:'#eae7dd|#5c574c',telling_price:'#dce6e9|#3d6376',
pending_quotation:'#e8dfea|#6c4f7b',quotation_sent:'#f5e7c4|#7d6015',follow_up:'#f9d5c7|#b04a2e',
agreement_signoff:'#dde4da|#4a6b4f',closed_won:'#d9e8dc|#2f6b41',closed_lost:'#f0ddd9|#a8412f'};
const TERMINAL=['closed_won','closed_lost'];
const WON='closed_won';
const LOST='closed_lost';
/* Qualification follows the stage: a lead is qualified from Quotation sent
   onwards, and moving it back makes it unqualified again. The one exception
   is a lost lead, where the current stage tells you nothing — there we fall
   back to the database column, which records whether it ever got that far. */
const QUALIFIED_STAGES=['quotation_sent','follow_up','agreement_signoff','closed_won'];
/* marketing keeps ownership of these stages even after a salesperson is
   assigned — must match the leads_select / leads_update policies */
const EARLY_STAGES=['info_gathering','telling_price','pending_quotation'];
function qualText(l){
  if(QUALIFIED_STAGES.includes(l.stage_code))return 'Qualified';
  if(l.stage_code===LOST)return l.qualification==='qualified'?'Qualified':'Disqualified';
  return 'Not qualified yet';
}
function qualPill(l){
  const t=qualText(l);
  if(t==='Qualified')return '<span class="badge b-on">qualified</span>';
  if(t==='Disqualified')return '<span class="badge b-off">disqualified</span>';
  return '<span class="days" style="display:inline">not yet</span>';
}
function stagePill(code){
  const st=STAGES.find(s=>s.stage_code===code)||{stage_name:code};
  const [bg,fg]=(STAGE_COLORS[code]||'#eee|#555').split('|');
  return `<span class="stagepill" style="background:${bg};color:${fg}">${esc(st.stage_name)}</span>`;
}

/* ---------------- auth ---------------- */
async function doLogin(){
  const btn=$('li-btn');btn.disabled=true;$('li-err').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('li-email').value.trim(),password:$('li-pass').value});
  btn.disabled=false;
  if(error){$('li-err').textContent='Sign in failed. Check your email and password.';return;}
  boot();
}
async function doLogout(){await sb.auth.signOut();location.reload();}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('login-view').style.display='flex';$('app-view').style.display='none';return;}
  const {data:prof,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!prof||!prof.is_active){
    $('li-err').textContent='Your account has no active CRM profile. Contact your admin.';
    await sb.auth.signOut();return;
  }
  ME=prof;
  const [stg,stf]=await Promise.all([
    sb.from('lead_stages').select('*').eq('is_active',true).order('sort_order'),
    sb.from('profiles').select('id,full_name,staff_id,role,is_active').order('full_name')
  ]);
  STAGES=stg.data||[];STAFF=stf.data||[];
  $('login-view').style.display='none';$('app-view').style.display='block';
  $('who').innerHTML=`<b>${esc(ME.full_name)}</b>${esc(ME.role)} · ${esc(ME.staff_id)}`;
  buildNav();go(ME.role==='site_engineer'?'won':'leads');followUpToday();
}

/* Leads whose follow-up date is today. Shown once, at login. */
async function followUpToday(){
  if(!['sales','manager','admin'].includes(ME.role))return;
  const today=new Date().toISOString().slice(0,10);
  let q=sb.from('leads').select('id,ref_id,customer_name,phone,stage_code')
    .eq('is_deleted',false).eq('next_follow_up',today);
  if(ME.role==='sales')q=q.eq('assigned_to',ME.id);
  const {data}=await q;
  if(!data||!data.length)return;
  $('lead-modal').innerHTML=`
    <h2>Follow up today</h2>
    <div class="sub">${data.length} lead${data.length>1?'s':''} due for follow-up today.</div>
    <div class="timeline">${data.map(l=>`
      <div class="tl-item rowlink" style="cursor:pointer" onclick="openLead('${l.id}')">
        <div class="t-head"><span class="refid">${esc(l.ref_id||'')}</span> ${esc(l.customer_name)}</div>
        <div class="t-meta">${esc(l.phone||'no phone')} · ${stagePill(l.stage_code)}</div>
      </div>`).join('')}</div>
    <div class="modal-actions"><button class="btn-sun" onclick="closeLead()">Got it</button></div>`;
  $('lead-overlay').classList.add('open');
}

function buildNav(){
  /* the site engineer only ever works won deals, so that is all they get */
  if(ME.role==='site_engineer'){
    $('nav').innerHTML=`<button id="nav-won" onclick="go('won')">Won</button>`;
    return;
  }
  const tabs=[['leads', ME.role==='engineer'?'My jobs':'Leads']];
  tabs.push(['won','Won']);
  tabs.push(['lost','Lost']);
  if(['manager','admin'].includes(ME.role)) tabs.push(['pool','Unassigned']);
  if(['marketing','sales','admin'].includes(ME.role)) tabs.push(['new','New lead']);
  if(['engineer','manager','admin'].includes(ME.role)) tabs.push(['quots','Quotations']);
  if(['marketing','manager','admin'].includes(ME.role)) tabs.push(['reports','Reports']);
  tabs.push(['comm','Commissions']);
  if(ME.role==='admin') tabs.push(['users','Users']);
  $('nav').innerHTML=tabs.map(([k,l])=>`<button id="nav-${k}" onclick="go('${k}')">${l}</button>`).join('');
}
function go(v){
  VIEW=v;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  const nb=$('nav-'+v);if(nb)nb.classList.add('active');
  ({leads:()=>renderLeads('active'),won:()=>renderLeads('won'),lost:()=>renderLeads('lost'),
    pool:renderPool,new:renderNew,quots:renderQuots,reports:renderReports,
    comm:renderComm,users:renderUsers}[v])();
}

/* ---------------- data ---------------- */
async function fetchLeads(extra){
  let q=sb.from('leads').select('*').eq('is_deleted',false).order('created_at',{ascending:false});
  if(extra)q=extra(q);
  const {data,error}=await q;
  if(error){toast('Could not load leads');console.error(error);return[];}
  return data||[];
}

/* ---------------- LEADS ---------------- */
/* One renderer, three tabs. "active" is the live pipeline, "won" is the
   construction hand-over, "lost" is the archive. Keeping won and lost out
   of the main list is the point: Leads should only show work in play. */
async function renderLeads(scope){
  LEADSCOPE=scope||'active';
  $('main').innerHTML=`<div class="empty">Loading…</div>`;
  LEADS=await fetchLeads(q=>{
    if(ME.role==='sales')return q.eq('assigned_to',ME.id);
    if(ME.role==='engineer')return q.eq('current_engineer_id',ME.id);
    if(ME.role==='site_engineer')return q.eq('site_engineer_id',ME.id);
    /* marketing is left to RLS, which gives them their own leads plus every
       lead not yet handed to sales — the ones they are meant to be working */
    return q;
  });
  const stg=STAGES.map(s=>`<option value="${s.stage_code}" ${s.stage_code===FILTER.stage?'selected':''}>${esc(s.stage_name)}</option>`).join('');
  const rows=scopeLeads();
  $('main').innerHTML=(LEADSCOPE==='active'?activeStats():LEADSCOPE==='won'?wonStats(rows):lostStats(rows))+`
    <div class="toolbar">
      <input placeholder="Search name, phone or ref ID…" value="${esc(FILTER.q||'')}" oninput="FILTER.q=this.value;drawTable()">
      ${LEADSCOPE==='active'?`
      <select onchange="FILTER.stage=this.value;drawTable()"><option value="">All stages</option>${stg}</select>
      <select onchange="FILTER.qual=this.value;drawTable()">
        <option value="">All leads</option>
        <option value="qualified" ${FILTER.qual==='qualified'?'selected':''}>Qualified only</option>
        <option value="none" ${FILTER.qual==='none'?'selected':''}>Not qualified yet</option>
      </select>`:''}
      <button class="btn-line" onclick="FILTER={stage:'',q:'',qual:''};renderLeads(LEADSCOPE)">Clear</button>
      <span class="spacer"></span>
      <button class="btn-line" onclick="exportLeads()" title="Exports the rows currently shown">Export CSV</button>
    </div>
    <div class="tablewrap" id="tablewrap"></div>`;
  drawTable();
}
function activeStats(){
  const rows=scopeLeads();
  const qual=rows.filter(l=>qualText(l)==='Qualified');
  const waiting=rows.filter(l=>qualText(l)!=='Qualified');
  const overdue=rows.filter(l=>l.next_follow_up&&new Date(l.next_follow_up)<new Date().setHours(0,0,0,0));
  return `<div class="stats">
      <div class="stat gold"><div class="n">${rows.length}</div><div class="l">In pipeline</div></div>
      <div class="stat"><div class="n">${qual.length}</div><div class="l">Qualified</div></div>
      <div class="stat"><div class="n">${waiting.length}</div><div class="l">Awaiting decision</div></div>
      <div class="stat"><div class="n" style="color:${overdue.length?'var(--bad)':'inherit'}">${overdue.length}</div><div class="l">Follow-up overdue</div></div>
    </div>`;
}
function wonStats(rows){
  const value=rows.reduce((a,l)=>a+Number(l.final_sale_usd||0),0);
  const booked=rows.filter(l=>l.construction_start);
  const done=rows.filter(l=>l.construction_end);
  return `<div class="stats">

function lostStats(rows){

/* rows for the current tab, before the toolbar filters */
function scopeLeads(){
  if(LEADSCOPE==='won')return LEADS.filter(l=>l.stage_code===WON);
  if(LEADSCOPE==='lost')return LEADS.filter(l=>l.stage_code===LOST);
  return LEADS.filter(l=>!STAGES.find(s=>s.stage_code===l.stage_code)?.is_terminal);
}
function filteredLeads(){
  let rows=scopeLeads();
  if(LEADSCOPE==='active'){
    if(FILTER.stage)rows=rows.filter(l=>l.stage_code===FILTER.stage);
    if(FILTER.qual==='none')rows=rows.filter(l=>qualText(l)!=='Qualified');
    else if(FILTER.qual==='qualified')rows=rows.filter(l=>qualText(l)==='Qualified');
  }
  if(FILTER.q){const q=FILTER.q.toLowerCase();rows=rows.filter(l=>
    (l.customer_name||'').toLowerCase().includes(q)||(l.phone||'').includes(q)||(l.ref_id||'').toLowerCase().includes(q));}
  return rows;
}
function drawTable(){
  const rows=filteredLeads();
  if(!rows.length){$('tablewrap').innerHTML=`<div class="empty">Nothing here.</div>`;return;}
  if(LEADSCOPE==='won')return drawWonTable(rows);
  if(LEADSCOPE==='lost')return drawLostTable(rows);
  $('tablewrap').innerHTML=`<table><thead><tr>
    <th>Ref ID</th><th>Customer</th><th>Type</th><th>Stage</th><th>Qualified</th><th>Sales</th><th>Engineer</th><th>Follow-up</th><th>Created</th>
  </tr></thead><tbody>`+rows.map(l=>{
    const od=l.next_follow_up&&new Date(l.next_follow_up)<new Date().setHours(0,0,0,0);
    return `<tr class="rowlink" onclick="openLead('${l.id}')">
      <td class="refid">${esc(l.ref_id||'—')}</td>
      <td><b>${esc(l.customer_name)}</b><span class="days">${esc(l.phone||'no phone yet')}</span></td>
      <td>${esc(l.customer_type||'—')}</td>
      <td>${stagePill(l.stage_code)}<span class="days">${daysIn(l.stage_entered_at)}d in stage</span></td>
      <td>${qualPill(l)}</td>
      <td>${l.assigned_to?esc(staffName(l.assigned_to)):'<span class="pooltag">NOT YET</span>'}</td>

      <td class="${od?'overdue':''}">${fmtDate(l.next_follow_up)}</td>
      <td>${fmtDate(l.created_at)}</td></tr>`;

}

async function assignLead(leadId,staffId){
  if(!staffId)return;
  const {error}=await sb.from('leads').update({assigned_to:staffId,assigned_at:new Date().toISOString()}).eq('id',leadId);

  await logActivity(leadId,'assigned',null,null,'Assigned to '+staffName(staffId));
  toast('Lead assigned to '+staffName(staffId));renderPool();
}

    customer_name:name,phone:phone||null,

    monthly_bill_usd:$('f-bill').value||null,
    lead_channel:$('f-chan').value,
    lead_sub_channel:$('f-sub').value||null,
    referrer_name:$('f-refname')?($('f-refname').value.trim()||null):null,

/* panel kWp = watt × pcs ÷ 1000 */
function kwp(w,p){const n=(Number(w)||0)*(Number(p)||0)/1000;return n?n.toFixed(2):'';}
function dKwp(){$('d-kwp').value=kwp($('d-pwatt').value,$('d-pcs').value);}
function qKwp(){$('q-kwp').value=kwp($('q-pwatt').value,$('q-pcs').value);}

async function saveLead(id,oldStage,oldAssign,oldEng){
  const canAssign=ME.role==='admin'||ME.role==='manager';
  const upd={};
  const val=id2=>{const e=$(id2);return e&&!e.disabled?e.value:undefined;};

  /* Every field is gated by whether openLead rendered its input enabled, so
     the permission rules live in one place instead of being restated here. */
  const m={phone:'d-phone',stage_code:'d-stage',next_follow_up:'d-follow',
           site_address:'d-addr',commune:'d-commune',district:'d-district',site_type:'d-sitetype',
           monthly_bill_usd:'d-bill',final_sale_usd:'d-sale',
           roof_type:'d-roof',system_type:'d-sys',phase_type:'d-phase',panel_pcs:'d-pcs',
           panel_watt:'d-pwatt',panel_brand:'d-pbrand',inverter_kw:'d-inv',inverter_brand:'d-ibrand',
           battery_kwh:'d-batt',battery_brand:'d-bbrand',
           delivery_date:'d-deliv',construction_start:'d-cstart',construction_end:'d-cend',
           site_notes:'d-sitenotes'};
  for(const k in m){const v=val(m[k]);if(v!==undefined)upd[k]=v.trim()||null;}
  const pv=val('d-prov'); if(pv!==undefined){upd.province=pv||null;upd.city_province=pv||null;}
  /* kWp is derived, and its input is readonly so val() skips it */
  const kw=$('d-kwp'); if(kw&&$('d-pwatt')&&!$('d-pwatt').disabled)upd.panel_kwp=kw.value||null;

  /* assignment: only write if actually changed (bug fix) */
  if(canAssign){
    const a=val('d-assign');
    if(a!==undefined&&a!==(oldAssign||'')){upd.assigned_to=a||null;upd.assigned_at=a?new Date().toISOString():null;}
    const e=val('d-eng');
    if(e!==undefined&&e!==(oldEng||''))upd.current_engineer_id=e||null;
  }
  const newStage=upd.stage_code??oldStage;
  if(newStage===WON&&oldStage!==WON&&!upd.final_sale_usd){toast('Enter the final sale value before marking Closed-Won');return;}
  if(!Object.keys(upd).length&&!($('d-note')&&$('d-note').value.trim())){toast('Nothing to save');return;}

  if(Object.keys(upd).length){
    const {error}=await sb.from('leads').update(upd).eq('id',id);
    if(error){toast('Save failed');console.error(error);return;}
  }
  const note=$('d-note')?$('d-note').value.trim():'';
  if(upd.stage_code&&upd.stage_code!==oldStage)await logActivity(id,'stage_change',oldStage,upd.stage_code,note||null);
  else if(note)await logActivity(id,'note',null,null,note);
  else await logActivity(id,'edit',null,null,null);
  if(upd.current_engineer_id!==undefined)await logActivity(id,'assigned',null,null,upd.current_engineer_id?('Engineer: '+staffName(upd.current_engineer_id)):'Engineer removed');

  toast(newStage===WON&&oldStage!==WON?'Saved — commissions created for this deal'
       :upd.stage_code==='quotation_sent'&&oldStage!=='quotation_sent'?'Saved — this lead is now qualified'
       :'Saved');
  closeLead();go(VIEW);
}
async function softDelete(id){
  if(!confirm('Delete this lead? It disappears from the CRM but stays in the database.'))return;
  const {error}=await sb.from('leads').update({is_deleted:true,deleted_at:new Date().toISOString(),deleted_by:ME.id}).eq('id',id);
  if(error){toast('Delete failed');return;}
  await logActivity(id,'soft_delete',null,null,null);
  toast('Lead deleted');closeLead();go('leads');
}
async function logActivity(leadId,type,from,to,note){
  await sb.from('lead_activities').insert({lead_id:leadId,actor_id:ME.id,activity_type:type,from_stage:from,to_stage:to,note});
}

/* ---------------- CSV EXPORT ----------------
   Everyone exports, but only what RLS already lets them read, so a sales
   export contains that salesperson's leads and nothing else. */
function csvCell(v){
  let s=v==null?'':String(v);
  /* Excel executes a cell starting with these, so defuse it */
  if(/^[=+\-@\t\r]/.test(s)) s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}
function downloadCSV(name,headers,rows){
  if(!rows.length){toast('Nothing to export');return;}
  const csv=[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
  /* the BOM is what stops Excel mangling Khmer text and accented names */
  const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));
  const a=document.createElement('a');
  a.href=url; a.download=`${name}-${localDay(new Date())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`Exported ${rows.length} row${rows.length>1?'s':''}`);
}

/* ---------------- REPORTS ----------------
   Categorical hues are the validated slots 1-4, assigned to a fixed channel
   (never by rank), so filtering never repaints a series. Legacy leads with no
   channel fold into a gray "Other" rather than earning a 5th hue.
   Aqua and gold sit under 3:1 on this surface, so the relief rule applies:
   segment values are labelled and the full table sits under the chart. */
const CH_ORDER=['Digital_Marketing','Third_Party','Direct_Sales','Offline_Marketing','Other'];
const CH_COLOR={Digital_Marketing:'#2a78d6',Third_Party:'#eb6834',Direct_Sales:'#1baf7a',
                Offline_Marketing:'#eda100',Other:'#898781'};
const chOf=l=>CH_ORDER.includes(l.lead_channel)?l.lead_channel:'Other';

async function renderReports(){
  $('main').innerHTML=`<div class="empty">Loading…</div>`;
  LEADS=await fetchLeads(q=>ME.role==='manager'||ME.role==='admin'?q:q.eq('created_by',ME.id));
  const won=LEADS.filter(l=>l.stage_code===WON);
  const lost=LEADS.filter(l=>l.stage_code==='closed_lost');
  const open=LEADS.filter(l=>!STAGES.find(s=>s.stage_code===l.stage_code)?.is_terminal);
  const decided=won.length+lost.length;
  const winRate=decided?Math.round(won.length/decided*100):null;
  const wonValue=won.reduce((a,l)=>a+Number(l.final_sale_usd||0),0);

  const months=[...new Set(LEADS.map(l=>localDay(l.created_at).slice(0,7)))].filter(Boolean).sort().slice(-12);
  const counts={};
  months.forEach(m=>{counts[m]={};CH_ORDER.forEach(c=>counts[m][c]=0);});
  LEADS.forEach(l=>{const m=localDay(l.created_at).slice(0,7);if(counts[m])counts[m][chOf(l)]++;});
  const used=CH_ORDER.filter(c=>months.some(m=>counts[m][c]>0));

  $('main').innerHTML=`
    <h2 style="margin-bottom:14px">Reports</h2>
    <div class="stats">
      <div class="stat gold"><div class="n">${LEADS.length}</div><div class="l">Total leads</div></div>
      <div class="stat"><div class="n">${open.length}</div><div class="l">In pipeline</div></div>
      <div class="stat"><div class="n">${won.length}</div><div class="l">Closed-Won</div></div>
      <div class="stat"><div class="n">${winRate===null?'—':winRate+'%'}</div><div class="l">Win rate</div></div>
      <div class="stat"><div class="n">${fmtMoney(wonValue)}</div><div class="l">Won value</div></div>
    </div>
    ${months.length?barChart(months,counts,used):'<div class="empty">No leads yet — the chart appears once leads are created.</div>'}
    ${stageTable()}`;
}

/* Stacked column chart, hand-rolled SVG: no chart library, no build step. */
function barChart(months,counts,used){
  const W=760,PL=42,PR=12,PT=12,PH=210,AX=34,H=PT+PH+AX;
  const plotW=W-PL-PR;
  const max=Math.max(1,...months.map(m=>used.reduce((a,c)=>a+counts[m][c],0)));
  const step=Math.max(1,Math.ceil(max/4));
  const top=step*4;
  const y=v=>PT+PH-(v/top)*PH;
  const band=plotW/months.length;
  const bw=Math.min(46,band*0.58);
  const GAP=2, R=4;
  const topPath=(x,yy,w,h,r)=>`M${x},${yy+h}V${yy+r}a${r},${r} 0 0 1 ${r},-${r}h${w-2*r}a${r},${r} 0 0 1 ${r},${r}V${yy+h}Z`;

  let grid='',bars='',xlab='';
  for(let i=0;i<=4;i++){
    const v=step*i, yy=y(v);
    grid+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`
        + `<text class="tick" x="${PL-8}" y="${yy+3}" text-anchor="end">${v}</text>`;
  }
  months.forEach((m,mi)=>{
    const cx=PL+band*mi+band/2, x=cx-bw/2;
    let acc=0;
    const stack=used.filter(c=>counts[m][c]>0);
    stack.forEach((c,si)=>{
      const v=counts[m][c];
      const y0=y(acc), y1=y(acc+v);
      let h=y0-y1; const isTop=si===stack.length-1;
      if(si>0){h-=GAP;}
      const yy=y1;
      bars+= (isTop&&h>R*2 ? `<path d="${topPath(x,yy,bw,h,R)}" fill="${CH_COLOR[c]}">`
                           : `<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(1,h)}" fill="${CH_COLOR[c]}">`)
           + `<title>${esc(monthName(m))} · ${esc(c.replace(/_/g,' '))}: ${v}</title>`
           + (isTop&&h>R*2?'</path>':'</rect>');
      if(h>=14&&bw>=22) bars+=`<text class="seglabel" x="${cx}" y="${yy+h/2+3}" text-anchor="middle">${v}</text>`;
      acc+=v;
    });
    xlab+=`<text class="tick" x="${cx}" y="${PT+PH+18}" text-anchor="middle">${esc(monthName(m))}</text>`;
  });

  const legend=used.map(c=>`<span><i style="background:${CH_COLOR[c]}"></i>${esc(c.replace(/_/g,' '))}</span>`).join('');
  const rows=months.map(m=>`<tr><td>${esc(monthName(m))}</td>${used.map(c=>`<td>${counts[m][c]||0}</td>`).join('')}
      <td><b>${used.reduce((a,c)=>a+counts[m][c],0)}</b></td></tr>`).join('');

  return `
  <div class="chartcard">
    <h3>Leads per month by channel</h3>
    <div class="cap">Leads grouped by the month they were created and the channel they came from.</div>
    <div class="legend">${legend}</div>
    <svg class="chartsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Leads per month by channel">
      ${grid}${bars}${xlab}
      <line x1="${PL}" y1="${PT+PH}" x2="${W-PR}" y2="${PT+PH}" stroke="var(--line)" stroke-width="1"/>
    </svg>
  </div>
  <div class="tablewrap" style="margin-bottom:18px"><table style="min-width:520px"><thead><tr>
    <th>Month</th>${used.map(c=>`<th>${esc(c.replace(/_/g,' '))}</th>`).join('')}<th>Total</th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function stageTable(){
  const n=LEADS.length||1;
  const rows=STAGES.map(s=>{
    const c=LEADS.filter(l=>l.stage_code===s.stage_code).length;
    return `<tr><td>${stagePill(s.stage_code)}</td><td>${c}</td><td>${Math.round(c/n*100)}%</td></tr>`;
  }).join('');
  return `<h3 style="font-size:15px;margin-bottom:8px">Pipeline by stage</h3>
    <div class="tablewrap"><table style="min-width:380px"><thead><tr>
      <th>Stage</th><th>Leads</th><th>Share</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function renderQuots(){
  $('main').innerHTML=`<div class="empty">Loading…</div>`;
  const {data:quots,error}=await sb.from('quotations').select('*, leads(ref_id, customer_name)').order('created_at',{ascending:false});
  if(error){$('main').innerHTML=`<div class="empty">Could not load quotations.</div>`;return;}
  QUOTS=quots||[];
  /* only offer months that actually have quotations, newest first */
  const monthOpts=[...new Set(QUOTS.map(q=>localDay(q.released_date||q.created_at).slice(0,7)))].filter(Boolean)
    .sort().reverse().map(m=>`<option value="${m}" ${m===QFILTER.month?'selected':''}>${monthName(m)}</option>`).join('');
  $('main').innerHTML=`
    <h2 style="margin-bottom:6px">Quotation log</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin-bottom:14px">Every quotation released, newest first. Add quotations from inside a lead.</p>
    <div class="toolbar">
      <input placeholder="Search customer or ref ID…" value="${esc(QFILTER.q||'')}" oninput="QFILTER.q=this.value;drawQuots()">
      <select title="Released in month" onchange="QFILTER.month=this.value;QFILTER.date='';drawQuots()">
        <option value="">All months</option>${monthOpts}</select>
      <input type="date" title="Released on this exact date" value="${esc(QFILTER.date||'')}" onchange="QFILTER.date=this.value;QFILTER.month='';drawQuots()">
      <button class="btn-line" onclick="QFILTER={q:'',month:'',date:''};renderQuots()">Clear</button>
      <span class="spacer"></span>
      <button class="btn-line" onclick="exportQuots()" title="Exports the rows currently shown">Export CSV</button>
    </div>
    <div class="tablewrap" id="quotwrap"></div>`;
  drawQuots();
}
function filteredQuots(){
  let rows=QUOTS;
  const day=q=>localDay(q.released_date||q.created_at);
  if(QFILTER.month)rows=rows.filter(q=>day(q).slice(0,7)===QFILTER.month);
  if(QFILTER.date)rows=rows.filter(q=>day(q)===QFILTER.date);
  if(QFILTER.q){const s=QFILTER.q.toLowerCase();rows=rows.filter(q=>
    (q.leads?.customer_name||'').toLowerCase().includes(s)||(q.leads?.ref_id||'').toLowerCase().includes(s));}
  return rows;
}
function drawQuots(){
  const rows=filteredQuots();
  if(!rows.length){$('quotwrap').innerHTML=`<div class="empty">No quotations match.</div>`;return;}
  $('quotwrap').innerHTML=`<table><thead><tr>
      <th>Ref ID</th><th>Customer</th><th>System</th><th>Panels</th><th>Inverter</th><th>Battery</th><th>Price</th><th>Released</th><th>By</th>
    </tr></thead><tbody>`+rows.map(q=>`
      <tr><td class="refid">${esc(q.leads?.ref_id||'—')}</td>
      <td><b>${esc(q.leads?.customer_name||'?')}</b></td>
      <td>${esc(q.system_type||'—')}<span class="days">${esc(q.ampere_phase||'')}</span></td>
      <td>${q.panel_pcs??'—'} ${esc(q.panel_brand||'')}<span class="days">${q.panel_kwp?q.panel_kwp+' kWp':''}</span></td>
      <td>${q.inverter_kw??'—'}kW ${esc(q.inverter_brand||'')}</td>
      <td>${esc(q.battery_kwh||'—')} ${esc(q.battery_brand||'')}</td>
      <td><b>${fmtMoney(q.price_usd)}</b></td>
      <td>${fmtDate(q.released_date)}</td>
      <td>${esc(staffName(q.provided_by))}</td></tr>`).join('')+`</tbody></table>`;
}

      </tr>`).join('')+`</tbody></table></div>`}`;
}
async function setCommAmount(id,val){
  const {error}=await sb.from('commissions').update({amount_usd:val||null}).eq('id',id);
  toast(error?'Update failed':'Amount saved');
}
async function markPaid(id){
  const {error}=await sb.from('commissions').update({is_paid:true,paid_at:new Date().toISOString()}).eq('id',id);
  if(error){toast('Failed');return;}toast('Marked paid');renderComm();
}

/* ---------------- USERS (admin) ---------------- */
async function renderUsers(){
  const {data:users}=await sb.from('profiles').select('*').order('created_at');
  $('main').innerHTML=`
    <h2 style="margin-bottom:10px">Users</h2>
    <div class="hint"><b>Adding a new user is a two-step job:</b><br>
      1. Supabase dashboard: Authentication → Users → Add user → email + temporary password.<br>
      2. Here: fill this form to give them a CRM profile, then send them the temp password privately.</div>
    <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:720px;margin-bottom:18px">
      <div class="grid2">
        <div><label>Email (must exactly match the auth user)</label><input id="u-email"></div>
        <div><label>Staff ID</label><input id="u-staff" placeholder="e.g. ENG001"></div>
        <div><label>Full name</label><input id="u-name"></div>
        <div><label>Role</label><select id="u-role">
          <option value="marketing">marketing</option><option value="sales">sales</option>
          <option value="engineer">engineer (quotes)</option>
          <option value="site_engineer">site_engineer (construction)</option>
          <option value="manager">manager</option><option value="admin">admin</option></select></div>
      </div>
      <div class="modal-actions"><button class="btn-sun" onclick="createProfile()">Create profile</button></div>
    </div>
    <div class="tablewrap"><table><thead><tr>
      <th>Name</th><th>Email</th><th>Staff ID</th><th>Role</th><th>Status</th><th></th>
    </tr></thead><tbody>`+(users||[]).map(u=>`
      <tr><td><b>${esc(u.full_name)}</b></td><td>${esc(u.email)}</td><td>${esc(u.staff_id)}</td><td>${esc(u.role)}</td>
      <td>${u.is_active?'<span class="badge b-on">active</span>':'<span class="badge b-off">inactive</span>'}</td>
      <td>${u.id===ME.id?'':`<button class="btn-line" onclick="toggleUser('${u.id}',${!u.is_active})">${u.is_active?'Deactivate':'Reactivate'}</button>`}</td>
      </tr>`).join('')+`</tbody></table></div>`;
}
async function createProfile(){
  const email=$('u-email').value.trim().toLowerCase();
  const staff=$('u-staff').value.trim(),name=$('u-name').value.trim(),role=$('u-role').value;
  if(!email||!staff||!name){toast('All fields are required');return;}
  const {error}=await sb.rpc('admin_create_profile',{p_email:email,p_staff_id:staff,p_full_name:name,p_role:role});
  if(error){toast(error.message.includes('not found')?'No auth user with that email — do step 1 first':'Create failed');console.error(error);return;}
  toast('Profile created');renderUsers();
}
async function toggleUser(id,active){
  const {error}=await sb.from('profiles').update({is_active:active}).eq('id',id);
  if(error){toast('Failed');return;}toast(active?'User reactivated':'User deactivated');renderUsers();
}

/* ---------------- start ---------------- */
$('li-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
boot();
</script>
