<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20260826q"></script>
<script src="geo.js?v=20260826q"></script>
<link rel="stylesheet" href="styles.css?v=20260826q">

</head>
<body>

<div id="login-view">
  <div class="login-card">
    <div class="sunmark"></div>
    <h1>Solar CRM</h1>
    <p>Sign in with your staff account</p>
    <label>Email</label>
    <input id="li-email" type="email" autocomplete="username">
    <label>Password</label>
    <input id="li-pass" type="password" autocomplete="current-password">
    <button class="btn-primary" id="li-btn" onclick="doLogin()">Sign in</button>
    <div class="err" id="li-err"></div>
  </div>
</div>

<div id="app-view">
  <aside id="side">
    <div class="brand"><span class="dot"></span>Solar CRM</div>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <div class="who" id="who"></div>
      <button class="btn-ghost" onclick="doLogout()">Sign out</button>
    </div>
  </aside>
  <div class="shell">
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <button class="bell" id="bell" onclick="openBells()" title="Notifications">🔔<span id="bell-n"></span></button>
    </div>
    <main id="main"></main>
  </div>
</div>

<div class="overlay" id="lead-overlay"><div class="modal" id="lead-modal"></div></div>
<div class="toast" id="toast"></div>
<div class="pop" id="pop"></div>

<script src="app-core.js?v=20260826q"></script>
<script src="app-home.js?v=20260826q"></script>
<script src="app-leads.js?v=20260826q"></script>
<script src="app-notify.js?v=20260826q"></script>
<script src="app-quotation.js?v=20260826q"></script>
<script src="app-lead-detail.js?v=20260826q"></script>
<script src="app-reports.js?v=20260826q"></script>
<script src="app-report-ops.js?v=20260826q"></script>
<script src="app-report-mkt.js?v=20260826q"></script>
<script src="app-targets.js?v=20260826q"></script>
<script src="app-report-sales.js?v=20260826q"></script>
<script src="app-incentive.js?v=20260826q"></script>
<script src="app-edc.js?v=20260826q"></script>
<script src="app-finance.js?v=20260826q"></script>
<script src="app-admin.js?v=20260826q"></script>
<script src="app-start.js?v=20260826q"></script>

</body>
</html>
