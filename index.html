<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="geo.js"></script>
<style>
:root{
  /* Sun-bleached concrete, terracotta tile, panel glass — one hue family,
     lightness does the work. */
  --paper:#efece3; --card:#fffefb; --card-alt:#f6f3ea; --sunk:#eae6da;

  /* four text levels: primary, secondary, tertiary, muted */
  --ink:#1a1714; --ink-2:#4a453d; --ink-soft:#6b6862; --ink-mute:#9b958a;
  --line:#e2ded2; --line-soft:#ece8dd;

  --sun:#cc785c; --sun-deep:#a85841; --sun-press:#8f4835; --sky:#3d6376;
  --ok:#2f6b41; --bad:#a8412f; --warn:#86601f;
  --pool:#6c4f7b; --eng:#4a7c8c;

  /* the handoff is the product: every block carries its owner's hue */
  --own-sales:#a85841; --own-site:#7c7563; --own-eng:#4a7c8c;
  --own-install:#7a6a3f; --own-edc:#6c4f7b; --own-fin:#2f6b41;

  /* type scale, 1.25 from a 14px body */
  --t-cap:11px; --t-meta:12px; --t-body:14px; --t-lg:16px;
  --t-h3:18px; --t-h2:22px; --t-h1:28px; --t-hero:44px;

  /* radius climbs with the element: control, card, modal */
  --r-sm:8px; --r:12px; --r-lg:16px;

  /* one depth strategy — a hairline ring plus two soft depths. No borders
     on containers; borders are for dividers and inputs only. */
  --lift:0 0 0 1px rgba(26,23,20,.07), 0 1px 2px -1px rgba(26,23,20,.07), 0 2px 6px rgba(26,23,20,.04);
  --lift-2:0 0 0 1px rgba(26,23,20,.08), 0 8px 18px -8px rgba(26,23,20,.20), 0 24px 48px -16px rgba(26,23,20,.24);
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);
  font-size:var(--t-body);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,.brand{font-family:'Source Serif 4',Georgia,serif;letter-spacing:-.02em;text-wrap:balance}
p{text-wrap:pretty}
/* every dynamic figure holds its column */
.n,td,.badge,.refid,input[type=number],input[type=date]{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;border-radius:var(--r-sm);font-size:var(--t-body);
  transition:background .14s var(--ease),color .14s var(--ease),border-color .14s var(--ease),transform .1s var(--ease),box-shadow .14s var(--ease)}
button:active{transform:scale(.975)}
input,select,textarea{font-family:inherit;font-size:var(--t-body);padding:9px 11px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink);width:100%;
  transition:border-color .14s var(--ease),box-shadow .14s var(--ease)}
/* inputs sit inset — a darker fill says "type here" without a heavy edge */
input:hover:not(:disabled),select:hover:not(:disabled),textarea:hover:not(:disabled){border-color:#d3cec0}
input:disabled,select:disabled,textarea:disabled{background:var(--sunk);color:var(--ink-mute);border-color:var(--line-soft)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sun);box-shadow:0 0 0 3px rgba(204,120,92,.18)}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
label{display:block;font-size:var(--t-cap);font-weight:600;color:var(--ink-soft);margin:10px 0 4px;
  text-transform:uppercase;letter-spacing:.07em}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}}

#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#191919 0%,#2e2823 55%,#5a4739 100%)}
.login-card{background:var(--card);padding:36px 32px;border-radius:var(--r-lg);width:360px;max-width:92vw;
  box-shadow:0 18px 50px rgba(25,20,15,.45)}
.sunmark{width:46px;height:46px;border-radius:50%;margin-bottom:14px;
  background:radial-gradient(circle at 35% 35%, #e9a98d, var(--sun) 55%, var(--sun-deep));
  box-shadow:0 0 0 6px rgba(204,120,92,.18), 0 0 24px rgba(204,120,92,.45)}
.login-card h1{font-size:var(--t-h2);margin-bottom:2px}
.login-card p{color:var(--ink-soft);font-size:var(--t-meta);margin-bottom:12px}
.btn-primary{background:var(--sun-deep);color:#fff;font-weight:600;padding:11px 16px;width:100%;margin-top:16px}
.btn-primary:hover{background:var(--sun-press)}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}

#app-view{display:none;min-height:100vh}
header{background:var(--ink);color:#fff;padding:0 18px;display:flex;align-items:center;gap:18px;height:54px;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px}
.brand .dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e9a98d,var(--sun))}
nav{display:flex;gap:4px;flex:1}
nav button{background:transparent;color:#b8b2a7;padding:8px 12px;border-radius:var(--r-sm);font-weight:600}
nav button.active{background:rgba(204,120,92,.22);color:#eeb193}
nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
.who{font-size:var(--t-meta);color:#a8a297;text-align:right;line-height:1.3}
.who b{color:#fff;display:block;font-size:var(--t-body)}
.btn-ghost{background:transparent;color:#c4bfb5;border:1px solid #4a443c;padding:7px 12px}
.btn-ghost:hover{color:#fff;border-color:#fff}
main{max-width:1240px;margin:0 auto;padding:26px 18px 72px}
main>h2{font-size:var(--t-h2)}
main>h3{font-size:var(--t-h3)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar input,.toolbar select{width:auto;min-width:150px}
.spacer{flex:1}
.btn-sun{background:var(--sun-deep);color:#fff;font-weight:600;padding:10px 16px;
  box-shadow:0 1px 2px rgba(168,88,65,.28)}
.btn-sun:hover{background:var(--sun-press);box-shadow:0 2px 6px rgba(168,88,65,.32)}
.btn-line{background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2);padding:10px 14px;font-weight:600}
.btn-line:hover{box-shadow:inset 0 0 0 1px #cdc7b8;color:var(--ink);background:var(--card-alt)}
/* scope switch: active, won and lost are one list sliced three ways, so they
   sit in the toolbar rather than pretending to be separate pages */
.scope{display:inline-flex;border-radius:var(--r-sm);background:var(--sunk);padding:3px;gap:2px}
.scope button{padding:7px 14px;font-weight:600;font-size:var(--t-body);color:var(--ink-soft);background:transparent;border-radius:6px}
.scope button:hover{color:var(--ink)}
.scope button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(26,23,20,.10)}
/* the step a deal is actually waiting on, so the eye lands on the work */
.edc-next{background:#fbeee8;box-shadow:inset 2px 0 0 var(--sun)}
/* the 860px floor above is for full-width data grids; a table inside a modal
   has about 800px to work with, so it needs its own rules */
.table-compact{min-width:0}
.table-compact th,.table-compact td{padding:8px 10px}
.btn-mini{background:#fff;border:1px solid var(--line);color:var(--ink-soft);padding:5px 10px;font-weight:600;font-size:12px}
.btn-mini:hover{border-color:var(--bad);color:var(--bad)}
.btn-danger{background:#fff;border:1px solid var(--bad);color:var(--bad);padding:10px 14px;font-weight:600}
.btn-danger:hover{background:var(--bad);color:#fff}

.tablewrap{background:var(--card);border-radius:var(--r);overflow:auto;box-shadow:var(--lift)}
table{width:100%;border-collapse:collapse;min-width:860px}
/* headers recede: the data is the content, the labels are scaffolding */
th{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-mute);font-weight:600;
  text-align:left;padding:12px 14px 8px;background:var(--card);position:sticky;top:0;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line-soft);font-size:var(--t-body);vertical-align:middle;color:var(--ink-2)}
/* the first column is the handle — it leads */
tbody td:first-child,td b{color:var(--ink)}
tr.rowlink{cursor:pointer;transition:background .12s var(--ease)}
tr.rowlink:hover{background:var(--card-alt)}
.stagepill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:var(--t-cap);font-weight:600;white-space:nowrap}
.days{font-size:var(--t-cap);color:var(--ink-mute);display:block;margin-top:2px;font-weight:400}
.pooltag{color:var(--pool);font-weight:700;font-size:var(--t-cap);letter-spacing:.04em}
.refid{font-size:var(--t-meta);color:var(--ink-mute);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.overdue{color:var(--bad);font-weight:600}
.quiet{color:var(--ink-mute)}
/* compact status marker — a column that is mostly one glyph wide */
.mark{display:inline-block;font-size:var(--t-cap);font-weight:600;padding:3px 8px;border-radius:6px;
  background:var(--sunk);color:var(--ink-mute);white-space:nowrap;letter-spacing:.02em}
.mark-done{background:#dfe9df;color:var(--ok)}
.mark-open{background:#f7e6dd;color:var(--sun-press)}
.mark-wait{background:var(--sunk);color:var(--ink-mute)}

/* Designed states. An empty list should say what would put something in it. */
.empty{padding:52px 24px;text-align:center;color:var(--ink-mute);font-size:var(--t-body)}
.empty b{display:block;font-family:'Source Serif 4',Georgia,serif;font-size:var(--t-h3);
  color:var(--ink-2);font-weight:600;margin-bottom:4px;letter-spacing:-.01em}
.empty span{display:block;max-width:38ch;margin:0 auto;font-size:var(--t-meta);color:var(--ink-mute)}
.skel{background:var(--card);border-radius:var(--r);box-shadow:var(--lift);padding:18px 20px;overflow:hidden}
.skel i{display:block;height:11px;border-radius:99px;margin:12px 0;
  background:linear-gradient(90deg,var(--sunk) 0%,#f4f1e7 40%,var(--sunk) 80%);
  background-size:220% 100%;animation:sweep 1.15s linear infinite}
.skel i:nth-child(1){width:34%;height:15px}
.skel i:nth-child(2){width:88%} .skel i:nth-child(3){width:72%}
.skel i:nth-child(4){width:80%} .skel i:nth-child(5){width:56%;margin-bottom:2px}
@keyframes sweep{to{background-position:-220% 0}}
@media(prefers-reduced-motion:reduce){.skel i{animation:none}}

.overlay{position:fixed;inset:0;background:rgba(25,20,15,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--r-lg);width:880px;max-width:100%;padding:26px;box-shadow:var(--lift-2)}
.modal h2{font-size:var(--t-h2);margin-bottom:4px}
.modal .sub{color:var(--ink-soft);font-size:var(--t-meta);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:680px){.grid2,.grid3{grid-template-columns:1fr}}
.modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
/* A lead passes through six pairs of hands. Each block wears its owner's
   colour on the left edge, so people learn the shape of the handoff. */
.section{background:var(--card-alt);border-radius:var(--r);padding:4px 18px 16px;margin-top:16px;
  border-left:3px solid var(--line);position:relative}
.section h4{font-size:var(--t-cap);text-transform:uppercase;letter-spacing:.09em;margin:12px 0 2px;
  font-family:'Inter',sans-serif;font-weight:600;color:var(--ink-mute)}
.sec-sales{border-left-color:var(--own-sales)}   .sec-sales h4{color:var(--own-sales)}
.sec-addr{border-left-color:var(--own-site)}     .sec-addr h4{color:var(--own-site)}
.sec-eng{border-left-color:var(--own-eng)}       .sec-eng h4{color:var(--own-eng)}
.sec-install{border-left-color:var(--own-install)} .sec-install h4{color:var(--own-install)}
.sec-quote{border-left-color:var(--sky)}         .sec-quote h4{color:var(--sky)}
.sec-fin{border-left-color:var(--own-fin)}       .sec-fin h4{color:var(--own-fin)}

.timeline{border-left:1px solid var(--line);margin:14px 0 0 8px;padding-left:20px}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-25px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--card);box-shadow:0 0 0 2px var(--sun)}
.tl-item .t-head{font-size:var(--t-body);font-weight:600;color:var(--ink)}
.tl-item .t-meta{font-size:var(--t-cap);color:var(--ink-mute)}
.tl-item .t-note{font-size:var(--t-meta);margin-top:4px;white-space:pre-wrap;color:var(--ink-2)}

/* What sales needs before scrolling: how old, how stale, what was quoted,
   what was last said — and one button between them and an accidental edit. */
.leadbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0 0;
  padding:11px 14px;background:var(--sunk);border-radius:var(--r)}
.leadbar .facts{display:flex;gap:16px;flex-wrap:wrap;flex:1;
  font-size:var(--t-meta);color:var(--ink-soft)}
.leadbar .facts b{color:var(--ink);font-weight:600}
.leadbar .barbtns{display:flex;gap:8px;align-items:center}
/* one control, two states: slide it to edit, slide it back to lock */
.switch{width:44px;height:26px;border-radius:99px;background:var(--ink-mute);
  position:relative;cursor:pointer;flex:none;transition:background .18s var(--ease)}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(26,23,20,.35);transition:transform .18s var(--ease)}
.switch.on{background:var(--sun)}
.switch.on i{transform:translateX(18px)}
.switch-l{font-size:var(--t-cap);text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-soft);font-weight:600;min-width:52px}
.lockmsg{font-size:var(--t-meta);color:var(--ink-soft);margin:2px 0 8px}
.sec-cust{border-left-color:var(--own-site)}
.sec-cust h4{color:var(--own-site)}
.lead-first{margin-top:16px}
.notebox{margin-top:12px}
.notebox label{display:block}
.noterow{display:flex;gap:8px;align-items:flex-start}
.noterow input[type=date]{width:150px;flex:none}
.noterow textarea{flex:1}
/* the running log, in the row itself: three lines, the rest on request */
td.cust{max-width:260px}
td.rem{width:300px;max-width:300px;white-space:normal}
.rstack{display:flex;flex-direction:column;gap:4px}
.rl{font-size:var(--t-meta);color:var(--ink-2);line-height:1.35}
.rl i{font-style:normal;color:var(--ink-mute);margin-right:6px;white-space:nowrap}
.rl.none{color:var(--ink-mute)}
.rstack.collapsed .rl:nth-of-type(n+4){display:none}
.rmore{align-self:flex-start;margin-top:2px;padding:2px 7px;font-size:var(--t-cap);
  font-weight:600;color:var(--ink-soft);background:var(--sunk);border-radius:99px}
.rmore:hover{color:var(--ink);background:var(--line)}
/* the log needs room, so this table is allowed to be wider than the rest */
table.with-rem{min-width:1120px}
td.nowrap{white-space:nowrap}
.recent{margin-top:12px;padding-left:12px;border-left:2px solid var(--line)}
.recent h4{font-size:var(--t-cap);text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-mute);margin:0 0 6px}
.r-item{margin-bottom:8px}
.r-meta{font-size:var(--t-cap);color:var(--ink-mute)}
.r-note{font-size:var(--t-meta);color:var(--ink-2);white-space:pre-wrap}

/* One figure answers "what do I do now" and dominates; the rest are context
   and are demoted to plain type with no container at all. */
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;align-items:stretch}
.stat{flex:1 1 130px;padding:16px 6px 14px}
.stat .n{font-family:'Source Serif 4',Georgia,serif;font-size:var(--t-h1);font-weight:600;
  line-height:1.05;color:var(--ink-2);letter-spacing:-.02em}
.stat .l{font-size:var(--t-cap);color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
/* The hero wins on size and surface alone. Colour is reserved: red appears
   only on .alert, where it means "this needs you", and nowhere else. */
.stat.hero{flex:1.25 1 190px;background:var(--card);border-radius:var(--r);padding:15px 18px 14px;
  box-shadow:var(--lift);position:relative;overflow:hidden}
.stat.hero .n{font-size:38px;color:var(--ink)}
/* the one label worth reading gets sentence case; the demoted ones stay
   as uppercase micro-type, so the two tiers do not look alike */
.stat.hero .l{color:var(--ink-2);font-weight:600;font-size:var(--t-meta);
  text-transform:none;letter-spacing:0;margin-top:2px}
.stat.hero.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bad)}
.stat.hero.alert .n,.stat.hero.alert .l{color:var(--bad)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:99px;font-size:var(--t-body);display:none;z-index:99;
  box-shadow:0 10px 30px rgba(26,23,20,.35)}
.badge{font-size:var(--t-cap);font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.02em}
.b-on{background:#dfe9df;color:var(--ok)} .b-off{background:#f2e0db;color:var(--bad)}
.hint{background:#f8f1e5;border-left:3px solid #d8b98a;border-radius:var(--r);padding:13px 16px;
  font-size:var(--t-meta);color:#6b5537;margin-bottom:16px}
.chartcard{background:var(--card);border-radius:var(--r);padding:20px 20px 12px;margin-bottom:20px;box-shadow:var(--lift)}
.chartcard h3{font-size:var(--t-h3);margin-bottom:2px}
.chartcard .cap{font-size:var(--t-meta);color:var(--ink-soft);margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--ink-soft)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.chartsvg{width:100%;height:auto;display:block}
.chartsvg text{font-family:'Inter',sans-serif}
.tick{font-size:10px;fill:var(--ink-soft);font-variant-numeric:tabular-nums}
.seglabel{font-size:10px;font-weight:600;fill:#fff;font-variant-numeric:tabular-nums}
.qcard{border-radius:var(--r-sm);padding:11px 13px;margin-top:8px;font-size:var(--t-meta);
  background:var(--card);box-shadow:inset 0 0 0 1px var(--line-soft);color:var(--ink-2)}
.qcard b{font-family:'Source Serif 4',Georgia,serif;font-size:var(--t-lg);color:var(--ink)}
@media(max-width:700px){ nav{overflow-x:auto} .who{display:none} }
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <div class="sunmark"></div>
    <h1>Solar CRM</h1>
    <p>Sign in with your staff account</p>
    <label>Email</label>
    <input id="li-email" type="email" autocomplete="username">
    <label>Password</label>
    <input id="li-pass" type="password" autocomplete="current-password">
    <button class="btn-primary" id="li-btn" onclick="doLogin()">Sign in</button>
    <div class="err" id="li-err"></div>
  </div>
</div>

<div id="app-view">
  <header>
    <div class="brand"><span class="dot"></span>Solar CRM</div>
    <nav id="nav"></nav>
    <div class="who" id="who"></div>
    <button class="btn-ghost" onclick="doLogout()">Sign out</button>
  </header>
  <main id="main"></main>
</div>

<div class="overlay" id="lead-overlay"><div class="modal" id="lead-modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   SOLAR CRM — frontend v2 (Phase 1)
   ============================================================ */
const sb = supabase.createClient(CRM_CONFIG.SUPABASE_URL, CRM_CONFIG.SUPABASE_ANON_KEY);

let ME=null, STAGES=[], STAFF=[], LEADS=[], QUOTS=[], COMMS=[], VIEW='leads', LEADLOCK=true;
/* the Leads tab shows only live work; won and lost have their own tabs */
let LEADSCOPE='active';
let FINROWS=[];
let FILTER={stage:'',q:'',qual:''};
let QFILTER={q:'',month:'',date:''};
/* local YYYY-MM-DD, so a late-evening lead in Cambodia isn't filed under tomorrow */
const localDay=d=>d?new Date(d).toLocaleDateString('sv'):'';
const monthName=m=>{const[y,mo]=m.split('-');return new Date(y,mo-1,1).toLocaleDateString('en-GB',{month:'short',year:'numeric'});};

/* Vocabularies from the client's Excel (Drop Down List sheet) */
const CHANNELS = {
  'Digital_Marketing': ['Facebook','Telegram','Tik Tok','Call','Walk-In'],
  'Third_Party':       ['Staff','Non-Staff'],
  'Direct_Sales':      [],   /* filled from the active sales staff at render time */
  'Offline_Marketing': ['Ground Activation']
};
const ROOF_TYPES = ['RC Roof/Awning','Zinc Roof','Tile Roof','Ground Mount','Other'];
const SYSTEM_TYPES = ['On-Grid','Hybrid','Off-Grid'];

/* warm pills; follow_up is deliberately coral and quotation_sent gold so
   the two neighbouring stages don't blur together in a long list */
const STAGE_COLORS={info_gathering:'#eae7dd|#5c574c',telling_price:'#dce6e9|#3d6376',
pending_quotation:'#e8dfea|#6c4f7b',quotation_sent:'#f5e7c4|#7d6015',follow_up:'#f9d5c7|#b04a2e',
agreement_signoff:'#dde4da|#4a6b4f',closed_won:'#d9e8dc|#2f6b41',closed_lost:'#f0ddd9|#a8412f'};
const TERMINAL=['closed_won','closed_lost'];
const WON='closed_won';
const LOST='closed_lost';
/* Qualification follows the stage: a lead is qualified from Quotation sent
   onwards, and moving it back makes it unqualified again. The one exception
   is a lost lead, where the current stage tells you nothing — there we fall
   back to the database column, which records whether it ever got that far. */
const QUALIFIED_STAGES=['quotation_sent','follow_up','agreement_signoff','closed_won'];
const INSTALL_TEAMS=['Team A','Team B','Team C','Team D'];
const CONTRACT_STATUS=['Not signed','Pending','Signed'];
const BOQ_STATUS=['Pending','Done'];
/* a follow-up lands on the same day of the month; February keeps the last day */
function addMonths(d,n){
  if(!d)return '';
  const [y,m,day]=d.split('-').map(Number);
  const t=new Date(y,m-1+n,1);
  const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  t.setDate(Math.min(day,last));
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
}
/* sale values live in lead_financials, which only these roles can read —
   this just keeps the interface honest about it */
const canSeeMoney=()=>['admin','manager','sales'].includes(ME.role);
const canFinance=()=>['admin','finance'].includes(ME.role);

/* EDC paperwork. Which form applies is decided by the inverter's AC output,
   not by anyone choosing: 10 kWac or under takes the short form, above it
   takes the long one. Small systems may be installed before submitting;
   large ones must be submitted first. */
/* short header, then the official wording for the tooltip — nobody reads a
   nine-word column head twice, they learn the position */
const EDC_SMALL=[['edc_doc_date','Submitted','Document submission date'],
                 ['edc_inspection_date','Inspection','Inspection date']];
const EDC_LARGE=[['edc_portal_date','Submitted','Document submission date via web portal'],
                 ['edc_approval_date','Approval','EDC approval letter received date'],
                 ['edc_meter_date','Smart meter','Smart meter installation & grid connection date'],
                 ['edc_provincial_date','Provincial','EDC provincial inspection date'],
                 ['edc_pp_date','Phnom Penh','EDC Phnom Penh inspection date']];
const kwac=l=>(Number(l.inverter_kw||0)*Number(l.inverter_pcs||0))||Number(l.inverter_kw_total||0);
/* three states, not two: EDC applies to on-grid and hybrid, off-grid is
   genuinely exempt, and a blank system type means nobody has said yet —
   which must not be silently treated as exempt */
const edcApplies=l=>l.system_type==='On-Grid'||l.system_type==='Hybrid';
const edcExempt=l=>l.system_type==='Off-Grid';
/* null means we cannot tell yet, because the inverter spec is missing */
const edcFields=l=>!edcApplies(l)||kwac(l)<=0?null:(kwac(l)<=10?EDC_SMALL:EDC_LARGE);
const edcDone=l=>{const f=edcFields(l);return f?f.filter(([k])=>l[k]).length:0;};
/* marketing keeps ownership of these stages even after a salesperson is
   assigned — must match the leads_select / leads_update policies */
const EARLY_STAGES=['info_gathering','telling_price','pending_quotation'];
function qualText(l){
  if(QUALIFIED_STAGES.includes(l.stage_code))return 'Qualified';
  if(l.stage_code===LOST)return l.qualification==='qualified'?'Qualified':'Disqualified';
  return 'Not qualified yet';
}
function qualPill(l){
  const t=qualText(l);
  if(t==='Qualified')return '<span class="badge b-on">qualified</span>';
  if(t==='Disqualified')return '<span class="badge b-off">disqualified</span>';
  return '<span class="days" style="display:inline">not yet</span>';
}
function stagePill(code){
  const st=STAGES.find(s=>s.stage_code===code)||{stage_name:code};
  const [bg,fg]=(STAGE_COLORS[code]||'#eee|#555').split('|');
  return `<span class="stagepill" style="background:${bg};color:${fg}">${esc(st.stage_name)}</span>`;
}

/* ---------------- auth ---------------- */
async function doLogin(){
  const btn=$('li-btn');btn.disabled=true;$('li-err').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('li-email').value.trim(),password:$('li-pass').value});
  btn.disabled=false;
  if(error){$('li-err').textContent='Sign in failed. Check your email and password.';return;}
  boot();
}
async function doLogout(){await sb.auth.signOut();location.reload();}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('login-view').style.display='flex';$('app-view').style.display='none';return;}
  const {data:prof,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!prof||!prof.is_active){
    $('li-err').textContent='Your account has no active CRM profile. Contact your admin.';
    await sb.auth.signOut();return;
  }
  ME=prof;
  const [stg,stf]=await Promise.all([
    sb.from('lead_stages').select('*').eq('is_active',true).order('sort_order'),
    sb.from('profiles').select('id,full_name,staff_id,role,is_active').order('full_name')
  ]);
  STAGES=stg.data||[];STAFF=stf.data||[];
  $('login-view').style.display='none';$('app-view').style.display='block';
  $('who').innerHTML=`<b>${esc(ME.full_name)}</b>${esc(ME.role)} · ${esc(ME.staff_id)}`;
  if(ME.role==='site_engineer')LEADSCOPE='won';
  buildNav();go(ME.role==='finance'?'fin':'leads');followUpToday();
}

/* Leads whose follow-up date is today. Shown once, at login. */
async function followUpToday(){
  if(!['sales','manager','admin'].includes(ME.role))return;
  const today=new Date().toISOString().slice(0,10);
  let q=sb.from('leads').select('id,ref_id,customer_name,phone,stage_code')
    .eq('is_deleted',false).eq('next_follow_up',today);
  if(ME.role==='sales')q=q.eq('assigned_to',ME.id);
  const {data}=await q;
  if(!data||!data.length)return;
  $('lead-modal').innerHTML=`
    <h2>Follow up today</h2>
    <div class="sub">${data.length} lead${data.length>1?'s':''} due for follow-up today.</div>
    <div class="timeline">${data.map(l=>`
      <div class="tl-item rowlink" style="cursor:pointer" onclick="openLead('${l.id}')">
        <div class="t-head"><span class="refid">${esc(l.ref_id||'')}</span> ${esc(l.customer_name)}</div>
        <div class="t-meta">${esc(l.phone||'no phone')} · ${stagePill(l.stage_code)}</div>
      </div>`).join('')}</div>
    <div class="modal-actions"><button class="btn-sun" onclick="closeLead()">Got it</button></div>`;
  $('lead-overlay').classList.add('open');
}

function buildNav(){
  /* the site engineer only ever works won deals, so that is all they get */
  if(ME.role==='site_engineer'){
    $('nav').innerHTML=`<button id="nav-leads" onclick="go('leads')">My jobs</button>`;
    return;
  }
  /* finance only ever works won deals and their money */
  if(ME.role==='finance'){
    $('nav').innerHTML=`<button id="nav-fin" onclick="go('fin')">Finance</button>`;
    return;
  }
  const tabs=[['leads', ME.role==='engineer'?'My jobs':'Leads']];
  if(['manager','admin'].includes(ME.role)) tabs.push(['pool','Unassigned']);
  if(['marketing','sales','admin'].includes(ME.role)) tabs.push(['new','New lead']);
  if(['engineer','manager','admin'].includes(ME.role)) tabs.push(['quots','Quotations']);
  if(['marketing','manager','admin'].includes(ME.role)) tabs.push(['reports','Reports']);
  if(ME.role==='admin') tabs.push(['edc','EDC']);
  if(canFinance()) tabs.push(['fin','Finance']);
  tabs.push(['comm','Commissions']);
  if(ME.role==='admin') tabs.push(['users','Users']);
  $('nav').innerHTML=tabs.map(([k,l])=>`<button id="nav-${k}" onclick="go('${k}')">${l}</button>`).join('');
}
function go(v){
  VIEW=v;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  const nb=$('nav-'+v);if(nb)nb.classList.add('active');
  /* Leads keeps whichever slice you were last looking at, so closing a won
     deal drops you back on Won rather than bouncing you to Active */
  ({leads:()=>renderLeads(LEADSCOPE),
    pool:renderPool,new:renderNew,quots:renderQuots,reports:renderReports,
    edc:renderEdc,fin:renderFinance,comm:renderComm,users:renderUsers}[v])();
}

/* ---------------- data ---------------- */
async function fetchLeads(extra){
  let q=sb.from('leads').select('*').eq('is_deleted',false).order('created_at',{ascending:false});
  if(extra)q=extra(q);
  const {data,error}=await q;
  if(error){toast('Could not load leads');console.error(error);return[];}
  return data||[];
}

/* ---------------- LEADS ---------------- */
/* Active, won and lost are one list sliced three ways. renderLeads fetches,
   paintLeads draws — kept apart so switching slice is instant and never
   round-trips to Supabase for rows it already holds. */
async function renderLeads(scope){
  LEADSCOPE=scope||LEADSCOPE;
  $('main').innerHTML=SKEL;
  LEADS=await fetchLeads(q=>{
    if(ME.role==='sales')return q.eq('assigned_to',ME.id);
    if(ME.role==='engineer')return q.eq('current_engineer_id',ME.id);
    if(ME.role==='site_engineer')return q.eq('site_engineer_id',ME.id);
    /* marketing is left to RLS, which gives them their own leads plus every
       lead not yet handed to sales — the ones they are meant to be working */
    return q;
  });
  /* sale values come from their own table, and only for roles the database
     lets read it — for anyone else they simply stay undefined */
  if(canSeeMoney()&&LEADS.length){
    const {data:fins}=await sb.from('lead_financials')
      .select('lead_id,final_sale_usd').in('lead_id',LEADS.map(l=>l.id));
    const byId=Object.fromEntries((fins||[]).map(f=>[f.lead_id,f.final_sale_usd]));
    LEADS.forEach(l=>{l.final_sale_usd=byId[l.id]??null;});
  }
  /* the newest remark per lead, so sales can read the list without opening rows */
  if(LEADS.length){
    const {data:rem}=await sb.from('lead_activities')
      .select('lead_id,note,note_date,created_at,actor_id')
      .in('lead_id',LEADS.map(l=>l.id)).not('note','is',null)
      .order('created_at',{ascending:false});
    const by={};
    (rem||[]).forEach(a=>{(by[a.lead_id]=by[a.lead_id]||[]).push(a);});
    LEADS.forEach(l=>{
      l.remarks=(by[l.id]||[]).sort((x,y)=>remarkDate(y).localeCompare(remarkDate(x)));
      l.last_remark=l.remarks[0]||null;
    });
    /* the last price quoted, for the column that replaces the salesperson's
       own name when they are looking at their own list */
    const {data:qs}=await sb.from('quotations')
      .select('lead_id,price_usd,created_at').in('lead_id',LEADS.map(l=>l.id))
      .order('created_at',{ascending:false});
    const qby={};
    (qs||[]).forEach(q=>{if(!qby[q.lead_id])qby[q.lead_id]=q;});
    LEADS.forEach(l=>{l.last_quot=qby[l.id]||null;});
  }
  paintLeads();
}
function paintLeads(){
  const stg=STAGES.map(s=>`<option value="${s.stage_code}" ${s.stage_code===FILTER.stage?'selected':''}>${esc(s.stage_name)}</option>`).join('');
  const rows=scopeLeads();
  $('main').innerHTML=(LEADSCOPE==='active'?activeStats():LEADSCOPE==='won'?wonStats(rows):lostStats(rows))+`
    <div class="toolbar">
      ${ME.role==='site_engineer'?'':`<div class="scope">
        ${[['active','Active'],['won','Won'],['lost','Lost']].map(([k,label])=>
          `<button class="${LEADSCOPE===k?'on':''}" onclick="setScope('${k}')">${label}</button>`).join('')}
      </div>`}
      <input placeholder="Search name, phone or ref ID…" value="${esc(FILTER.q||'')}" oninput="FILTER.q=this.value;drawTable()">
      ${LEADSCOPE==='active'?`
      <select onchange="FILTER.stage=this.value;drawTable()"><option value="">All stages</option>${stg}</select>
      <select onchange="FILTER.qual=this.value;drawTable()">
        <option value="">All leads</option>
        <option value="qualified" ${FILTER.qual==='qualified'?'selected':''}>Qualified only</option>
        <option value="none" ${FILTER.qual==='none'?'selected':''}>Not qualified yet</option>
      </select>`:''}
      <button class="btn-line" onclick="FILTER={stage:'',q:'',qual:''};paintLeads()">Clear</button>
      <span class="spacer"></span>
      <button class="btn-line" onclick="exportLeads()" title="Exports the rows currently shown">Export CSV</button>
    </div>
    <div class="tablewrap" id="tablewrap"></div>`;
  drawTable();
}
/* filters are cleared on a scope change, since a stage filter means nothing
   on Won or Lost and would silently hide rows */
function setScope(s){
  if(LEADSCOPE===s)return;
  LEADSCOPE=s;
  FILTER={stage:'',q:'',qual:''};
  paintLeads();
}
function activeStats(){
  const rows=scopeLeads();
  const qual=rows.filter(l=>qualText(l)==='Qualified');
  const waiting=rows.filter(l=>qualText(l)!=='Qualified');
  const overdue=rows.filter(l=>l.next_follow_up&&new Date(l.next_follow_up)<new Date().setHours(0,0,0,0));
  return `<div class="stats">
      <div class="stat hero ${overdue.length?'alert':''}"><div class="n">${overdue.length}</div><div class="l">Follow-up overdue</div></div>
      <div class="stat"><div class="n">${rows.length}</div><div class="l">In pipeline</div></div>
      <div class="stat"><div class="n">${qual.length}</div><div class="l">Qualified</div></div>
      <div class="stat"><div class="n">${waiting.length}</div><div class="l">Awaiting decision</div></div>
    </div>`;
}
function wonStats(rows){
  const value=rows.reduce((a,l)=>a+Number(l.final_sale_usd||0),0);
  const booked=rows.filter(l=>l.installation_start);
  const teamed=rows.filter(l=>l.installation_team);
  return `<div class="stats">
      <div class="stat hero"><div class="n">${rows.length}</div><div class="l">Won deals</div></div>
      ${canSeeMoney()?`<div class="stat"><div class="n">${fmtMoney(value)}</div><div class="l">Total sale value</div></div>`:''}
      <div class="stat"><div class="n">${booked.length}</div><div class="l">Installation booked</div></div>
      <div class="stat"><div class="n">${teamed.length}</div><div class="l">Team assigned</div></div>
    </div>`;
}
function lostStats(rows){
  return `<div class="stats">
      <div class="stat hero"><div class="n">${rows.length}</div><div class="l">Lost leads</div></div>
    </div>`;
}
/* rows for the current tab, before the toolbar filters */
function scopeLeads(){
  if(LEADSCOPE==='won')return LEADS.filter(l=>l.stage_code===WON);
  if(LEADSCOPE==='lost')return LEADS.filter(l=>l.stage_code===LOST);
  return LEADS.filter(l=>!STAGES.find(s=>s.stage_code===l.stage_code)?.is_terminal);
}
function filteredLeads(){
  let rows=scopeLeads();
  if(LEADSCOPE==='active'){
    if(FILTER.stage)rows=rows.filter(l=>l.stage_code===FILTER.stage);
    if(FILTER.qual==='none')rows=rows.filter(l=>qualText(l)!=='Qualified');
    else if(FILTER.qual==='qualified')rows=rows.filter(l=>qualText(l)==='Qualified');
  }
  if(FILTER.q){const q=FILTER.q.toLowerCase();rows=rows.filter(l=>
    (l.customer_name||'').toLowerCase().includes(q)||(l.phone||'').includes(q)||(l.ref_id||'').toLowerCase().includes(q));}
  return rows;
}
function drawTable(){
  const rows=filteredLeads();
  if(!rows.length){$('tablewrap').innerHTML=FILTER.q||FILTER.stage||FILTER.qual
    ?blank('No matches','Nothing in this list fits the current search or filters. Clear them to see everything.')
    :LEADSCOPE==='won'?blank('No won deals yet','Deals appear here once a salesperson marks them Closed-Won.')
    :LEADSCOPE==='lost'?blank('Nothing lost','Leads marked Closed-Lost are kept here.')
    :blank('No active leads','New leads land here as soon as they are created.');return;}
  if(LEADSCOPE==='won')return drawWonTable(rows);
  if(LEADSCOPE==='lost')return drawLostTable(rows);
  $('tablewrap').innerHTML=`<table class="${showRemarks()?'with-rem':''}"><thead><tr>
    <th>Ref ID</th><th>Customer</th><th>Stage</th><th>Qualified</th><th>${ME.role==='sales'?'Quotation':'Sales'}</th><th>Engineer</th><th>Follow-up</th><th>Aging</th>${showRemarks()?'<th>Remarks</th>':''}
  </tr></thead><tbody>`+rows.map(l=>{
    const od=l.next_follow_up&&new Date(l.next_follow_up)<new Date().setHours(0,0,0,0);
    return `<tr class="rowlink" onclick="openLead('${l.id}')">
      <td class="refid">${esc(l.ref_id||'—')}</td>
      <td class="cust"><b>${esc(l.customer_name)}</b><span class="days">${esc(l.phone||'no phone yet')}${l.customer_type?' · '+esc(l.customer_type):''}</span></td>
      <td>${stagePill(l.stage_code)}</td>
      <td>${qualPill(l)}</td>
      <td>${ME.role==='sales'
        ?(l.last_quot?`<b>${fmtMoney(l.last_quot.price_usd)}</b><span class="days">${fmtDate(l.last_quot.created_at)}</span>`:'—')
        :(l.assigned_to?esc(staffName(l.assigned_to)):'<span class="pooltag">NOT YET</span>')}</td>
      <td>${l.current_engineer_id?esc(staffName(l.current_engineer_id)):'—'}</td>
      <td class="${od?'overdue':''}">${fmtDate(l.next_follow_up)}</td>
      <td class="nowrap"><b>${daysIn(l.created_at)}d</b> old<span class="days">${daysIn(l.stage_entered_at)}d in stage</span></td>
      ${showRemarks()?`<td class="rem">${remarkStack(l)}</td>`:''}</tr>`;
  }).join('')+`</tbody></table>`;
}
/* the date the contact happened, which is not always the day it was typed */
const remarkDate=a=>a?(a.note_date||localDay(a.created_at)):'';
/* the running log is the salesperson's working view, and nobody else's */
const showRemarks=()=>ME.role==='sales'||ME.role==='admin';
/* three most recent in the row, the rest one click away and still in the row */
function remarkStack(l){
  const rs=l.remarks||[];
  if(!rs.length)return '<span class="rl none">no remark yet</span>';
  const extra=rs.length-3;
  return `<div class="rstack collapsed">
    ${rs.map(a=>`<span class="rl"><i>${fmtDate(remarkDate(a))}</i>${esc(a.note)}</span>`).join('')}
    ${extra>0?`<button class="rmore" onclick="event.stopPropagation();toggleRemarks(this)">${extra} more</button>`:''}
  </div>`;
}
function toggleRemarks(btn){
  const box=btn.parentElement, open=box.classList.toggle('collapsed');
  btn.textContent=open?((box.querySelectorAll('.rl').length-3)+' more'):'Show less';
}
/* Won deals are a build schedule, not a pipeline, so the columns change */
function drawWonTable(rows){
  $('tablewrap').innerHTML=`<table><thead><tr>
    <th>Ref ID</th><th>Customer</th>${canSeeMoney()?'<th>Sale value</th>':''}<th>Salesperson</th><th>Site engineer</th><th>Schedule</th>${ME.role==='admin'?'<th>EDC</th>':''}<th>Won</th>
  </tr></thead><tbody>`+rows.map(l=>`
    <tr class="rowlink" onclick="openLead('${l.id}')">
      <td class="refid">${esc(l.ref_id||'—')}</td>
      <td><b>${esc(l.customer_name)}</b><span class="days">${esc(l.phone||'')}</span></td>
      ${canSeeMoney()?`<td><b>${fmtMoney(l.final_sale_usd)}</b></td>`:''}
      <td>${esc(staffName(l.assigned_to))}</td>
      <td>${l.site_engineer_id?esc(staffName(l.site_engineer_id)):'<span class="pooltag">NONE</span>'}<span class="days">${esc(l.installation_team||'no team')}</span></td>
      <td>${l.installation_start||l.installation_end
        ?`${fmtDate(l.installation_start)} → ${fmtDate(l.installation_end)}<span class="days">${l.delivery_date?'delivery '+fmtDate(l.delivery_date):'no delivery date'}</span>`
        :`<span class="quiet">not scheduled</span>${l.delivery_date?`<span class="days">delivery ${fmtDate(l.delivery_date)}</span>`:''}`}</td>
      ${ME.role==='admin'?`<td>${edcExempt(l)?'<span class="mark">off-grid</span>'
        :!edcApplies(l)||!edcFields(l)?'<span class="mark mark-wait">pending</span>'
        :`<span class="mark ${edcDone(l)===edcFields(l).length?'mark-done':'mark-open'}">${edcDone(l)}/${edcFields(l).length}</span>`}</td>`:''}
      <td>${fmtDate(l.stage_entered_at)}</td></tr>`).join('')+`</tbody></table>`;
}

async function renderPool(){
  $('main').innerHTML=SKEL;
  const pool=await fetchLeads(q=>q.is('assigned_to',null));
  const canAssign=['manager','admin'].includes(ME.role);
  const salesOpts=STAFF.filter(s=>s.role==='sales'&&s.is_active)
    .map(s=>`<option value="${s.id}">${esc(s.full_name)} (${esc(s.staff_id)})</option>`).join('');
  $('main').innerHTML=`
    <h2 style="margin-bottom:6px">Not yet with sales</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin-bottom:14px">No phone number yet, so no salesperson. Add a number and one gets assigned automatically. Assign by hand only if you need to.</p>
    ${pool.length?`<div class="tablewrap"><table><thead><tr>
      <th>Ref ID</th><th>Customer</th><th>Phone</th><th>Channel</th><th>Waiting</th><th>Created by</th><th style="min-width:220px">Assign</th>
    </tr></thead><tbody>`+pool.map(l=>`
      <tr><td class="refid">${esc(l.ref_id||'—')}</td>
      <td><b class="rowlink" style="cursor:pointer" onclick="openLead('${l.id}')">${esc(l.customer_name)}</b></td>
      <td>${esc(l.phone||'—')}</td><td>${esc(l.lead_channel||l.lead_source||'—')}</td>
      <td>${daysIn(l.created_at)}d</td><td>${esc(staffName(l.created_by))}</td>
      <td>${canAssign?`<div style="display:flex;gap:6px"><select id="as-${l.id}">${salesOpts}</select>
            <button class="btn-sun" onclick="assignLead('${l.id}',document.getElementById('as-${l.id}').value)">Assign</button></div>`:'—'}</td>
      </tr>`).join('')+`</tbody></table></div>`:blank('Everything is with sales','Leads appear here only while they have no phone number. Adding one assigns a salesperson automatically.')}`;
}
async function assignLead(leadId,staffId){
  if(!staffId)return;
  const {error}=await sb.from('leads').update({assigned_to:staffId,assigned_at:new Date().toISOString()}).eq('id',leadId);
  if(error){toast('Assign failed');console.error(error);return;}
  await logActivity(leadId,'assigned',null,null,'Assigned to '+staffName(staffId));
  toast('Lead assigned to '+staffName(staffId));renderPool();
}

function subChan(){
  const ch=$('f-chan').value;
  let subs=CHANNELS[ch]||[];
  if(ch==='Direct_Sales') subs=STAFF.filter(s=>s.role==='sales'&&s.is_active).map(s=>s.full_name);
  $('f-sub').innerHTML=optList(subs,'');
  $('f-refwrap').style.display  = ch==='Third_Party'      ? 'grid' : 'none';
  $('f-eventwrap').style.display= ch==='Offline_Marketing'? 'grid' : 'none';
}
function geoProv(){
  const d=GEO[$('f-prov').value]||{};
  $('f-district').innerHTML=optList(Object.keys(d),'');
  geoDist();
}
function geoDist(){
  const list=(GEO[$('f-prov').value]||{})[$('f-district').value]||[];
  $('f-commune').innerHTML=optList(list,'');
}
async function createLead(){
  const name=$('f-name').value.trim(),phone=$('f-phone').value.trim();
  if(!name){toast('Customer name is required');return;}
  const row={
    customer_name:name,phone:phone||null,
    customer_type:$('f-ctype').value,
    monthly_bill_usd:$('f-bill').value||null,
    lead_channel:$('f-chan').value,
    lead_sub_channel:$('f-sub').value||null,
    referrer_name:$('f-refname')?($('f-refname').value.trim()||null):null,
    referrer_phone:$('f-refphone')?($('f-refphone').value.trim()||null):null,
    site_address:$('f-addr').value.trim()||null,
    commune:$('f-commune').value.trim()||null,
    district:$('f-district').value||null,
    province:$('f-prov').value||null,
    city_province:$('f-prov').value||null,
    site_type:$('f-sitetype').value.trim()||null,
    created_by:ME.id
  };
  if($('f-chan').value==='Offline_Marketing'){
    row.event_name=$('f-eventname').value.trim()||null;
    row.event_date=$('f-eventdate').value||null;
  }
  const {data,error}=await sb.from('leads').insert(row).select().single();
  if(error){toast('Create failed');console.error(error);return;}
  await logActivity(data.id,'created',null,'info_gathering',$('f-note').value.trim()||'Lead created');
  toast((data.ref_id?'Lead '+data.ref_id+' created':'Lead created')
    +(data.assigned_to?', assigned to '+staffName(data.assigned_to)
      :' Add the phone number to hand it to sales.'));
  LEADSCOPE='active';go('leads');
}

/* ---------------- LEAD DETAIL ---------------- */
async function openLead(id){
  const [{data:l,error},{data:acts},{data:quots},{data:fin}]=await Promise.all([
    sb.from('leads').select('*').eq('id',id).single(),
    sb.from('lead_activities').select('*').eq('lead_id',id).order('created_at',{ascending:false}),
    sb.from('quotations').select('*').eq('lead_id',id).order('created_at',{ascending:false}),
    /* returns nothing at all for marketing and the site engineer — the
       database refuses the row, the interface is not what hides it */
    sb.from('lead_financials').select('final_sale_usd').eq('lead_id',id).maybeSingle()
  ]);
  if(error||!l){toast('Could not open lead');return;}
  const isAdmin=ME.role==='admin';
  const isSales=ME.role==='sales'&&l.assigned_to===ME.id;
  const isEng=ME.role==='engineer'&&l.current_engineer_id===ME.id;
  /* marketing owns their own leads, plus anything still in an early stage */
  const isMkt=ME.role==='marketing'&&(l.created_by===ME.id||EARLY_STAGES.includes(l.stage_code));
  const isSiteEng=ME.role==='site_engineer'&&l.site_engineer_id===ME.id;
  const canAssign=isAdmin||ME.role==='manager';
  /* the engineering box belongs to engineering again; marketing never sees it */
  const canEng=isAdmin||isEng;
  const seeEng=ME.role!=='marketing';
  /* stage, follow-up and remarks are the day-to-day, open to whoever works the lead */
  const canSales=isAdmin||ME.role==='manager'||isSales||isMkt||isEng;
  /* customer identity is marketing's to keep. Sales get one pass at it, then it
     locks; admin can reopen it. */
  const canCustomer=isAdmin||isMkt||(isSales&&!l.customer_locked);
  const custLocked=isSales&&l.customer_locked;
  /* the database only lets an engineer or admin insert a quotation, so the
     button follows that rather than the shared key-in rule */
  const canQuote=isAdmin||isEng;
  const canSite=isAdmin||isSiteEng;
  const canMoney=isAdmin||ME.role==='manager'||isSales;
  const contacted=(acts||[]).filter(a=>['call','note','stage_change'].includes(a.activity_type)).length;
  /* what sales asks first: how old, how stale, what was quoted, what was said */
  const lastQuot=(quots||[])[0];
  /* newest first, by the day the contact happened rather than the day it was typed */
  const allRemarks=(acts||[]).filter(a=>a.note).sort((x,y)=>remarkDate(y).localeCompare(remarkDate(x)));
  const recentNotes=allRemarks.slice(0,3);
  const canEditAny=canSales||canEng||canSite||canAssign;

  /* someone who cannot see the sale value must not be able to close a deal
     either, or they hit the "enter the final sale value" guard with no field
     to fill it in */
  const stageList=canMoney?STAGES:STAGES.filter(s=>!TERMINAL.includes(s.stage_code)||s.stage_code===l.stage_code);
  const stgOpts=stageList.map(s=>opt(s.stage_code,l.stage_code).replace(`>${esc(s.stage_code)}<`,`>${esc(s.stage_name)}<`)).join('');
  /* assignment dropdowns: always include current assignee even if role changed (bug fix) */
  const salesPeople=STAFF.filter(s=>(s.role==='sales'&&s.is_active)||s.id===l.assigned_to);
  const salesOpts=`<option value="">Pool (unassigned)</option>`+salesPeople.map(s=>`<option value="${s.id}" ${s.id===l.assigned_to?'selected':''}>${esc(s.full_name)}</option>`).join('');
  const PV=l.province||l.city_province||'Phnom Penh';
  const engPeople=STAFF.filter(s=>(s.role==='engineer'&&s.is_active)||s.id===l.current_engineer_id);
  const engOpts=`<option value="">None</option>`+engPeople.map(s=>`<option value="${s.id}" ${s.id===l.current_engineer_id?'selected':''}>${esc(s.full_name)}</option>`).join('');

  $('lead-modal').innerHTML=`
    <h2>${esc(l.customer_name)} <span class="refid">${esc(l.ref_id||'')}</span></h2>
    <div class="sub">${esc(l.phone||'no phone yet')} · ${esc(l.customer_type||'')} · created ${fmtDate(l.created_at)} by ${esc(staffName(l.created_by))} · contacted ${contacted}×</div>

    <div class="leadbar">
      <div class="facts">${isSiteEng?`
        <span>delivery <b>${l.delivery_date?fmtDate(l.delivery_date):'not set'}</b></span>
        <span>install <b>${l.installation_start?fmtDate(l.installation_start):'not set'}</b></span>
        <span>BOQ <b>${esc(l.boq_status||'not set')}</b></span>`:`
        <span><b>${daysIn(l.created_at)}d</b> old</span>
        <span><b>${daysIn(l.stage_entered_at)}d</b> in stage</span>
        <span>follow-up <b>${l.next_follow_up?fmtDate(l.next_follow_up):'—'}</b></span>
        <span>latest quote <b>${lastQuot?fmtMoney(lastQuot.price_usd):'none'}</b></span>`}
      </div>
      ${canEditAny?`<div class="barbtns">
        <span class="switch" id="lockbtn" role="switch" aria-checked="false" onclick="toggleLock()"><i></i></span>
        <span class="switch-l" id="locklbl">Locked</span>
        <button id="savebtn" class="btn-sun" style="display:none" onclick="saveLead('${l.id}','${l.stage_code}','${l.assigned_to||''}','${l.current_engineer_id||''}')">Save</button>
      </div>`:''}
    </div>

    ${isSiteEng?siteBox(l,canSite,true):''}

    ${canSales?`<div class="section sec-sales"><h4>Working</h4>
      <div class="grid2">
        <div><label>Stage</label><select id="d-stage">${stgOpts}</select></div>
        <div><label>Next follow-up</label><input id="d-follow" type="date" value="${l.next_follow_up||''}"></div>
        ${canMoney?`<div id="d-salewrap" style="display:${l.stage_code===WON?'block':'none'}">
          <label>Final sale value (USD)</label><input id="d-sale" type="number" step="0.01" value="${fin?.final_sale_usd??''}"></div>`:''}
      </div>
      <label style="margin-top:10px;display:block">Add remark</label>
      <div class="noterow">
        <input id="d-notedate" type="date" value="${localDay(new Date())}" title="The day it happened">
        <textarea id="d-note" rows="2" placeholder="What happened?"></textarea>
      </div>
    </div>`:''}

    ${recentNotes.length?`<div class="recent"><h4>Remarks (${allRemarks.length})</h4>${recentNotes.map(a=>`
      <div class="r-item"><div class="r-meta">${fmtDate(remarkDate(a))} · ${esc(staffName(a.actor_id))}</div>
      <div class="r-note">${esc(a.note)}</div></div>`).join('')}
      ${allRemarks.length>recentNotes.length?`<span class="days">${allRemarks.length-recentNotes.length} more in the history below</span>`:''}</div>`:''}

    <div class="section sec-cust"><h4>Customer${custLocked?' · locked':''}</h4>
      ${custLocked?'<p class="lockmsg">Already corrected once. Ask an admin to reopen it.</p>':''}
      <div class="grid2">
        <div><label>Customer name</label><input id="d-name" value="${esc(l.customer_name||'')}" ${canCustomer?'':'disabled'}></div>
        <div><label>Customer type</label><select id="d-ctype" ${canCustomer?'':'disabled'}>${optList(CUSTOMER_TYPES,l.customer_type)}</select></div>
        <div><label>Phone</label><input id="d-phone" value="${esc(l.phone||'')}" placeholder="Not captured yet" ${canCustomer?'':'disabled'}></div>
        <div><label>Qualification</label><input value="${qualText(l)}" disabled title="Follows the stage. Qualified from Quotation Sent onwards."></div>
        <div><label>Assigned salesperson</label><select id="d-assign" ${canAssign?'':'disabled'}>${salesOpts}</select></div>
        <div><label>Assigned engineer</label><select id="d-eng" ${canAssign?'':'disabled'}>${engOpts}</select></div>
        <div><label>Channel</label><input value="${esc(l.lead_channel||l.lead_source||'—')}${l.lead_sub_channel?' / '+esc(l.lead_sub_channel):''}" disabled></div>
        ${l.referrer_name?`<div><label>Referrer</label><input value="${esc(l.referrer_name)} ${esc(l.referrer_phone||'')}" disabled></div>`:''}
        ${isAdmin&&l.customer_locked?`<div><label>Customer lock</label><button class="btn-line" onclick="unlockCustomer('${l.id}')">Reopen for sales</button></div>`:''}
      </div>
    </div>

    <div class="section sec-addr"><h4>Site</h4>
      <div class="grid2">
        <div style="grid-column:1/-1"><label>Address</label><input id="d-addr" value="${esc(l.site_address||'')}" ${canCustomer?'':'disabled'}></div>
        <div><label>Province / City</label><select id="d-prov" onchange="dProv()" ${canCustomer?'':'disabled'}>${optList(PROVINCES,PV,false)}</select></div>
        <div><label>District</label><select id="d-district" onchange="dDist()" ${canCustomer?'':'disabled'}>${optList(Object.keys(GEO[PV]||{}),l.district)}</select></div>
        <div><label>Commune</label><select id="d-commune" ${canCustomer?'':'disabled'}>${optList(((GEO[PV]||{})[l.district])||[],l.commune)}</select></div>
        <div><label>Type of site</label><input id="d-sitetype" value="${esc(l.site_type||'')}" ${canCustomer?'':'disabled'}></div>
        <div><label>Monthly bill (USD)</label><input id="d-bill" type="number" step="0.01" value="${l.monthly_bill_usd??''}" ${canCustomer?'':'disabled'}></div>
      </div>
    </div>

    ${seeEng?`<div class="section sec-eng"><h4>Sale Engineer key-in ${l.current_engineer_id?('· '+esc(staffName(l.current_engineer_id))):''}${l.original_engineer_id&&l.original_engineer_id!==l.current_engineer_id?(' (original: '+esc(staffName(l.original_engineer_id))+')'):''}</h4>

    ${seeEng?`<div class="section sec-quote"><h4>Quotations (${(quots||[]).length})</h4>

async function saveLead(id,oldStage,oldAssign,oldEng){
  const canAssign=ME.role==='admin'||ME.role==='manager';
  const upd={};
  const val=id2=>{const e=$(id2);return e&&!e.disabled?e.value:undefined;};

  /* Every field is gated by whether openLead rendered its input enabled, so
     the permission rules live in one place instead of being restated here. */
  const m={customer_name:'d-name',customer_type:'d-ctype',phone:'d-phone',
           stage_code:'d-stage',next_follow_up:'d-follow',
           site_address:'d-addr',commune:'d-commune',district:'d-district',site_type:'d-sitetype',
           monthly_bill_usd:'d-bill',
           roof_type:'d-roof',system_type:'d-sys',phase_type:'d-phase',panel_pcs:'d-pcs',
           panel_watt:'d-pwatt',panel_brand:'d-pbrand',inverter_kw:'d-inv',inverter_pcs:'d-ipcs',
           inverter_brand:'d-ibrand',
           battery_kwh:'d-batt',battery_brand:'d-bbrand',battery_pcs:'d-bpcs',
           site_link:'d-sitelink',
           delivery_date:'d-deliv',installation_start:'d-cstart',installation_end:'d-cend',
           installation_team:'d-team',site_notes:'d-sitenotes',
           boq_status:'d-boq',boq_date:'d-boqdate'};
  for(const k in m){const v=val(m[k]);if(v!==undefined)upd[k]=v.trim()||null;}
  const pv=val('d-prov'); if(pv!==undefined){upd.province=pv||null;upd.city_province=pv||null;}
  /* panel kWp is derived, and its input is readonly so val() skips it */
  const kw=$('d-kwp'); if(kw&&$('d-pwatt')&&!$('d-pwatt').disabled)upd.panel_kwp=kw.value||null;
  /* the inverter total has no box any more, but EDC still needs the number */
  if(upd.inverter_kw!==undefined||upd.inverter_pcs!==undefined){
    const t=(Number(upd.inverter_kw??0)||0)*(Number(upd.inverter_pcs??0)||0);
    upd.inverter_kw_total=t||null;
  }
  /* sales get one pass at the customer box, then it locks behind them */
  if(ME.role==='sales'&&$('d-name')&&!$('d-name').disabled)upd.customer_locked=true;

  /* the sale value lives in its own table, which marketing and the site
     engineer have no read or write access to at all */
  const sale=val('d-sale');

  /* assignment: only write if actually changed (bug fix) */
  if(canAssign){
    const a=val('d-assign');
    if(a!==undefined&&a!==(oldAssign||'')){upd.assigned_to=a||null;upd.assigned_at=a?new Date().toISOString():null;}
    const e=val('d-eng');
    if(e!==undefined&&e!==(oldEng||''))upd.current_engineer_id=e||null;
  }
  /* the name is the one field that must never be blanked */
  if(upd.customer_name===null){toast('Customer name cannot be empty');return;}
  const newStage=upd.stage_code??oldStage;
  if(newStage===WON&&oldStage!==WON&&!sale){toast('Enter the final sale value before marking Closed-Won');return;}
  if(!Object.keys(upd).length&&sale===undefined&&!($('d-note')&&$('d-note').value.trim())){toast('Nothing to save');return;}

  if(Object.keys(upd).length){
    const {error}=await sb.from('leads').update(upd).eq('id',id);
    if(error){toast('Save failed');console.error(error);return;}
  }
  if(sale!==undefined){
    const {error}=await sb.from('lead_financials')
      .upsert({lead_id:id,final_sale_usd:sale||null,updated_by:ME.id,updated_at:new Date().toISOString()},{onConflict:'lead_id'});
    if(error){toast('Saved, but the sale value did not');console.error(error);return;}
  }
  const note=$('d-note')?$('d-note').value.trim():'';
  const nd=$('d-notedate')?$('d-notedate').value:'';
  if(upd.stage_code&&upd.stage_code!==oldStage)await logActivity(id,'stage_change',oldStage,upd.stage_code,note||null,nd);
  else if(note)await logActivity(id,'note',null,null,note,nd);
  else await logActivity(id,'edit',null,null,null);
  if(upd.current_engineer_id!==undefined)await logActivity(id,'assigned',null,null,upd.current_engineer_id?('Engineer: '+staffName(upd.current_engineer_id)):'Engineer removed');

  toast(newStage===WON&&oldStage!==WON?'Saved. Commissions created for this deal.'
       :upd.stage_code==='quotation_sent'&&oldStage!=='quotation_sent'?'Saved. This lead is now qualified.'
       :'Saved');
  closeLead();go(VIEW);
}

  if(error){toast('Could not reopen it');console.error(error);return;}

/* ---------------- CSV EXPORT ----------------
   Everyone exports, but only what RLS already lets them read, so a sales
   export contains that salesperson's leads and nothing else. */
function csvCell(v){
  let s=v==null?'':String(v);
  /* Excel executes a cell starting with these, so defuse it */
  if(/^[=+\-@\t\r]/.test(s)) s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}
function downloadCSV(name,headers,rows){
  if(!rows.length){toast('Nothing to export');return;}
  const csv=[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
  /* the BOM is what stops Excel mangling Khmer text and accented names */
  const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));
  const a=document.createElement('a');
  a.href=url; a.download=`${name}-${localDay(new Date())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`Exported ${rows.length} row${rows.length>1?'s':''}`);
}

/* ---------------- REPORTS ----------------

const CH_ORDER=['Digital_Marketing','Third_Party','Direct_Sales','Offline_Marketing','Other'];
const CH_COLOR={Digital_Marketing:'#2a78d6',Third_Party:'#eb6834',Direct_Sales:'#1baf7a',

const chOf=l=>CH_ORDER.includes(l.lead_channel)?l.lead_channel:'Other';

/* Stacked column chart, hand-rolled SVG: no chart library, no build step. */
function barChart(months,counts,used){
  const W=760,PL=42,PR=12,PT=12,PH=210,AX=34,H=PT+PH+AX;
  const plotW=W-PL-PR;
  const max=Math.max(1,...months.map(m=>used.reduce((a,c)=>a+counts[m][c],0)));
  const step=Math.max(1,Math.ceil(max/4));
  const top=step*4;
  const y=v=>PT+PH-(v/top)*PH;
  const band=plotW/months.length;
  const bw=Math.min(46,band*0.58);
  const GAP=2, R=4;
  const topPath=(x,yy,w,h,r)=>`M${x},${yy+h}V${yy+r}a${r},${r} 0 0 1 ${r},-${r}h${w-2*r}a${r},${r} 0 0 1 ${r},${r}V${yy+h}Z`;

  let grid='',bars='',xlab='';
  for(let i=0;i<=4;i++){
    const v=step*i, yy=y(v);
    grid+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`
        + `<text class="tick" x="${PL-8}" y="${yy+3}" text-anchor="end">${v}</text>`;
  }
  months.forEach((m,mi)=>{
    const cx=PL+band*mi+band/2, x=cx-bw/2;
    let acc=0;
    const stack=used.filter(c=>counts[m][c]>0);
    stack.forEach((c,si)=>{
      const v=counts[m][c];
      const y0=y(acc), y1=y(acc+v);
      let h=y0-y1; const isTop=si===stack.length-1;
      if(si>0){h-=GAP;}
      const yy=y1;
      bars+= (isTop&&h>R*2 ? `<path d="${topPath(x,yy,bw,h,R)}" fill="${CH_COLOR[c]}">`
                           : `<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(1,h)}" fill="${CH_COLOR[c]}">`)
           + `<title>${esc(monthName(m))} · ${esc(c.replace(/_/g,' '))}: ${v}</title>`
           + (isTop&&h>R*2?'</path>':'</rect>');
      if(h>=14&&bw>=22) bars+=`<text class="seglabel" x="${cx}" y="${yy+h/2+3}" text-anchor="middle">${v}</text>`;
      acc+=v;
    });
    xlab+=`<text class="tick" x="${cx}" y="${PT+PH+18}" text-anchor="middle">${esc(monthName(m))}</text>`;
  });

  const legend=used.map(c=>`<span><i style="background:${CH_COLOR[c]}"></i>${esc(c.replace(/_/g,' '))}</span>`).join('');
  const rows=months.map(m=>`<tr><td>${esc(monthName(m))}</td>${used.map(c=>`<td>${counts[m][c]||0}</td>`).join('')}
      <td><b>${used.reduce((a,c)=>a+counts[m][c],0)}</b></td></tr>`).join('');

  return `
  <div class="chartcard">
    <h3>Leads per month by channel</h3>
    <div class="cap">Leads grouped by the month they were created and the channel they came from.</div>
    <div class="legend">${legend}</div>
    <svg class="chartsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Leads per month by channel">
      ${grid}${bars}${xlab}
      <line x1="${PL}" y1="${PT+PH}" x2="${W-PR}" y2="${PT+PH}" stroke="var(--line)" stroke-width="1"/>
    </svg>
  </div>
  <div class="tablewrap" style="margin-bottom:18px"><table style="min-width:520px"><thead><tr>
    <th>Month</th>${used.map(c=>`<th>${esc(c.replace(/_/g,' '))}</th>`).join('')}<th>Total</th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function stageTable(){
  const n=LEADS.length||1;
  const rows=STAGES.map(s=>{
    const c=LEADS.filter(l=>l.stage_code===s.stage_code).length;
    return `<tr><td>${stagePill(s.stage_code)}</td><td>${c}</td><td>${Math.round(c/n*100)}%</td></tr>`;
  }).join('');
  return `<h3 style="font-size:15px;margin-bottom:8px">Pipeline by stage</h3>
    <div class="tablewrap"><table style="min-width:380px"><thead><tr>
      <th>Stage</th><th>Leads</th><th>Share</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

  QUOTS=quots||[];
  /* only offer months that actually have quotations, newest first */
  const monthOpts=[...new Set(QUOTS.map(q=>localDay(q.released_date||q.created_at).slice(0,7)))].filter(Boolean)
    .sort().reverse().map(m=>`<option value="${m}" ${m===QFILTER.month?'selected':''}>${monthName(m)}</option>`).join('');
  $('main').innerHTML=`
    <h2 style="margin-bottom:6px">Quotation log</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin-bottom:14px">Every quotation released, newest first. Add quotations from inside a lead.</p>
    <div class="toolbar">
      <input placeholder="Search customer or ref ID…" value="${esc(QFILTER.q||'')}" oninput="QFILTER.q=this.value;drawQuots()">
      <select title="Released in month" onchange="QFILTER.month=this.value;QFILTER.date='';drawQuots()">
        <option value="">All months</option>${monthOpts}</select>
      <input type="date" title="Released on this exact date" value="${esc(QFILTER.date||'')}" onchange="QFILTER.date=this.value;QFILTER.month='';drawQuots()">
      <button class="btn-line" onclick="QFILTER={q:'',month:'',date:''};renderQuots()">Clear</button>
      <span class="spacer"></span>
      <button class="btn-line" onclick="exportQuots()" title="Exports the rows currently shown">Export CSV</button>
    </div>
    <div class="tablewrap" id="quotwrap"></div>`;
  drawQuots();
}
function filteredQuots(){
  let rows=QUOTS;
  const day=q=>localDay(q.released_date||q.created_at);
  if(QFILTER.month)rows=rows.filter(q=>day(q).slice(0,7)===QFILTER.month);
  if(QFILTER.date)rows=rows.filter(q=>day(q)===QFILTER.date);
  if(QFILTER.q){const s=QFILTER.q.toLowerCase();rows=rows.filter(q=>
    (q.leads?.customer_name||'').toLowerCase().includes(s)||(q.leads?.ref_id||'').toLowerCase().includes(s));}
  return rows;
}
function drawQuots(){
  const rows=filteredQuots();
  if(!rows.length){$('quotwrap').innerHTML=QUOTS.length
    ?blank('No matches','No quotation fits the current search or dates.')
    :blank('No quotations yet','An engineer releases a quotation from inside a lead, and it is logged here.');return;}
  $('quotwrap').innerHTML=`<table><thead><tr>
      <th>Ref ID</th><th>Customer</th><th>System</th><th>Panels</th><th>Inverter</th><th>Battery</th><th>Price</th><th>Released</th><th>By</th>

      <tr><td class="refid">${esc(q.leads?.ref_id||'—')}</td>
      <td><b>${esc(q.leads?.customer_name||'?')}</b></td>
      <td>${esc(q.system_type||'—')}<span class="days">${esc(q.ampere_phase||'')}</span></td>
      <td>${q.panel_pcs??'—'} ${esc(q.panel_brand||'')}<span class="days">${q.panel_kwp?q.panel_kwp+' kWp':''}</span></td>
      <td>${q.inverter_pcs??'—'} × ${q.inverter_kw??'—'}kW ${esc(q.inverter_brand||'')}<span class="days">${q.inverter_kw_total?q.inverter_kw_total+' kW total':''}</span></td>
      <td>${esc(q.battery_kwh||'—')} ${esc(q.battery_brand||'')}</td>
      <td><b>${fmtMoney(q.price_usd)}</b></td>
      <td>${fmtDate(q.released_date)}</td>

}

/* ---------------- EDC (admin) ----------------
   Operations work is a worklist, not a lead-by-lead hunt. Every won deal with
   its outstanding dates, edited in place. The two size bands need different
   columns, so they get a table each. */
async function renderEdc(){
  $('main').innerHTML=SKEL;
  const rows=await fetchLeads(q=>q.eq('stage_code',WON));
  const applicable=rows.filter(edcApplies);
  const small=applicable.filter(l=>edcFields(l)===EDC_SMALL);
  const large=applicable.filter(l=>edcFields(l)===EDC_LARGE);
  /* anything not off-grid that we still cannot place: either nobody has set
     the system type, or there is no inverter total to give a kWac */
  const pending=rows.filter(l=>!edcExempt(l)&&!edcFields(l));
  const outstanding=[...small,...large].filter(l=>edcDone(l)<edcFields(l).length);
  $('main').innerHTML=`
    <h2 style="margin-bottom:6px">EDC approval letter</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin-bottom:14px">On-Grid and Hybrid won deals, split by inverter kWac. Dates save when you pick them.</p>
    <div class="stats">
      <div class="stat hero ${outstanding.length?'alert':''}"><div class="n">${outstanding.length}</div><div class="l">Still outstanding</div></div>
      <div class="stat"><div class="n">${applicable.length}</div><div class="l">Won deals</div></div>
      <div class="stat"><div class="n">${small.length}</div><div class="l">≤ 10 kWac</div></div>
      <div class="stat"><div class="n">${large.length}</div><div class="l">&gt; 10 kWac</div></div>
    </div>
    ${edcTable('Inverter ≤ 10 kWac',small,EDC_SMALL)}
    ${edcTable('Inverter &gt; 10 kWac',large,EDC_LARGE)}
    ${pending.length?`<h3 style="font-size:15px;margin:0 0 6px">Missing information (${pending.length})</h3>
      <p style="color:var(--ink-soft);font-size:13px;margin-bottom:10px">Not placed yet. The sale engineer needs to finish the spec.</p>
      <div class="tablewrap"><table><thead><tr><th>Ref ID</th><th>Customer</th><th>Missing</th><th>Salesperson</th><th>Won</th></tr></thead><tbody>`
      +pending.map(l=>`<tr class="rowlink" onclick="openLead('${l.id}')">
        <td class="refid">${esc(l.ref_id||'—')}</td><td><b>${esc(l.customer_name)}</b></td>
        <td>${!edcApplies(l)?'System type':'Inverter total'}</td>
        <td>${esc(staffName(l.assigned_to))}</td><td>${fmtDate(l.stage_entered_at)}</td></tr>`).join('')
      +`</tbody></table></div>`:''}`;
}
function edcTable(title,rows,fields){
  if(!rows.length)return `<h3 style="font-size:15px;margin:0 0 6px">${title}</h3>
    <div class="empty" style="margin-bottom:22px"><b>Nothing in this band</b><span>Won deals land here once their inverter total puts them in this size.</span></div>`;
  return `<h3 style="font-size:15px;margin:0 0 8px">${title}</h3>
    <div class="tablewrap" style="margin-bottom:22px"><table><thead><tr>
      <th>Ref ID</th><th>Customer</th>${fields.map(([,short,full])=>`<th title="${esc(full)}">${short}</th>`).join('')}<th>Done</th>
    </tr></thead><tbody>`+rows.map(l=>{
      const next=fields.find(([k])=>!l[k]);
      return `<tr>
      <td class="refid" style="cursor:pointer" onclick="openLead('${l.id}')" title="Open the lead">${esc(l.ref_id||'—')}</td>
      <td><b>${esc(l.customer_name)}</b><span class="days">${kwac(l)} kWac · ${esc(staffName(l.site_engineer_id))}</span></td>
      ${fields.map(([k])=>`<td class="${next&&next[0]===k?'edc-next':''}"><input type="date" style="min-width:130px" value="${l[k]||''}" onchange="setEdcDate('${l.id}','${k}',this.value)"></td>`).join('')}
      <td><b>${edcDone(l)}/${fields.length}</b></td>
    </tr>`;}).join('')+`</tbody></table></div>`;
}
async function setEdcDate(id,col,v){
  const {error}=await sb.from('leads').update({[col]:v||null}).eq('id',id);
  if(error){toast('Could not save that date');console.error(error);return;}
  await logActivity(id,'edit',null,null,'EDC '+col.replace(/^edc_/,'').replace(/_/g,' ')+': '+(v||'cleared'));
  toast('Saved');
}

/* ---------------- FINANCE ----------------
   Won deals with the money attached: what the contract says, what has been
   paid, what is left. Contract total is kept separate from the sale value
   sales recorded at closing, so a disagreement between them is visible
   rather than quietly overwritten. */
const sysLine=l=>[l.system_type,l.panel_kwp?l.panel_kwp+' kWp':null,
  l.inverter_kw_total?l.inverter_kw_total+' kW':null].filter(Boolean).join(' · ')||'—';
const finPaid=r=>(r.payments||[]).reduce((a,p)=>a+Number(p.amount_usd||0),0);
const finDue=r=>Number(r.fin?.contract_total_usd??r.final_sale_usd??0)+Number(r.fin?.other_fee_usd||0);
/* due today or overdue, and only while there is still money outstanding */
const finFollowDue=r=>!!r.fin?.follow_up_date&&r.fin.follow_up_date<=localDay(new Date())&&finDue(r)-finPaid(r)>0;

async function renderFinance(){
  $('main').innerHTML=SKEL;
  const leads=await fetchLeads(q=>q.eq('stage_code',WON));
  const ids=leads.map(l=>l.id);
  const [{data:fins},{data:pays},{data:sale}]=await Promise.all([
    sb.from('lead_finance').select('*'),
    sb.from('lead_payments').select('*').order('paid_on'),
    sb.from('lead_financials').select('lead_id,final_sale_usd')
  ]);
  const finBy=Object.fromEntries((fins||[]).map(f=>[f.lead_id,f]));
  const saleBy=Object.fromEntries((sale||[]).map(f=>[f.lead_id,f.final_sale_usd]));
  FINROWS=leads.map(l=>({...l,fin:finBy[l.id]||null,final_sale_usd:saleBy[l.id]??null,
    payments:(pays||[]).filter(p=>p.lead_id===l.id)}));

  const contracted=FINROWS.filter(r=>r.fin?.contract_signed_date);
  const totalDue=FINROWS.reduce((a,r)=>a+finDue(r),0);
  const totalPaid=FINROWS.reduce((a,r)=>a+finPaid(r),0);
  const dueNow=FINROWS.filter(r=>finFollowDue(r));
  $('main').innerHTML=`
    <h2 style="margin-bottom:6px">Finance</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin-bottom:14px">Won deals. Open a row to record the contract and its payments.</p>
    <div class="stats">
      <div class="stat hero ${totalDue-totalPaid>0?'alert':''}"><div class="n">${fmtMoney(totalDue-totalPaid)}</div><div class="l">Outstanding</div></div>
      <div class="stat"><div class="n">${dueNow.length}</div><div class="l">Follow up now</div></div>
      <div class="stat"><div class="n">${fmtMoney(totalPaid)}</div><div class="l">Collected</div></div>
      <div class="stat"><div class="n">${FINROWS.length}</div><div class="l">Won deals</div></div>
      <div class="stat"><div class="n">${contracted.length}</div><div class="l">Contract signed</div></div>
    </div>
    <div class="toolbar">
      <input placeholder="Search customer or ref ID…" oninput="FILTER.q=this.value;drawFinance()" value="${esc(FILTER.q||'')}">
      <button class="btn-line" onclick="FILTER.q='';renderFinance()">Clear</button>
      <span class="spacer"></span>
      <button class="btn-line" onclick="exportFinance()">Export CSV</button>
    </div>
    <div class="tablewrap" id="finwrap"></div>`;
  drawFinance();
}
function filteredFin(){
  if(!FILTER.q)return FINROWS;
  const s=FILTER.q.toLowerCase();
  return FINROWS.filter(r=>(r.customer_name||'').toLowerCase().includes(s)||(r.ref_id||'').toLowerCase().includes(s));
}
function drawFinance(){
  const rows=filteredFin();
  if(!rows.length){$('finwrap').innerHTML=FINROWS.length
    ?blank('No matches','No deal fits the current search.')
    :blank('No won deals yet','Contracts and payments can be recorded here once a deal is closed.');return;}
  $('finwrap').innerHTML=`<table><thead><tr>
    <th>Ref ID</th><th>Customer</th><th>Won</th><th>Received</th><th>Salesperson</th>
    <th>Channel</th><th>System</th><th>Sale value</th><th>Contract</th><th>Status</th>
    <th>Follow-up</th><th>Paid</th><th>Balance</th>
  </tr></thead><tbody>`+rows.map(r=>{
    const paid=finPaid(r), due=finDue(r), bal=due-paid, dueNow=finFollowDue(r);
    return `<tr class="rowlink" onclick="openFinance('${r.id}')">
      <td class="refid">${esc(r.ref_id||'—')}</td>
      <td><b>${esc(r.customer_name)}</b></td>
      <td>${r.stage_entered_at?monthName(localDay(r.stage_entered_at).slice(0,7)):'—'}</td>
      <td>${fmtDate(r.created_at)}</td>
      <td>${esc(staffName(r.assigned_to))}</td>
      <td>${esc(r.lead_channel||r.lead_source||'—')}<span class="days">${esc(r.lead_sub_channel||'')}</span></td>
      <td>${esc(sysLine(r))}</td>
      <td>${fmtMoney(r.final_sale_usd)}</td>

      <td>${r.fin?.follow_up_date?`<b style="color:${dueNow?'var(--bad)':'inherit'}">${fmtDate(r.fin.follow_up_date)}</b>`:'—'}</td>
      <td>${fmtMoney(paid)}<span class="days">${r.payments.length} payment${r.payments.length===1?'':'s'}</span></td>
      <td><b style="color:${bal>0?'var(--bad)':'inherit'}">${fmtMoney(bal)}</b></td>
    </tr>`;}).join('')+`</tbody></table>`;
}

async function saveFinance(id){
  const row={lead_id:id,
    contract_status:$('f-status').value||null,
    contract_signed_date:$('f-signed').value||null,
    contract_total_usd:$('f-total').value||null,
    other_fee_usd:$('f-fee').value||null,
    other_fee_note:$('f-feenote').value.trim()||null,
    follow_up_date:$('f-follow').value||null,
    updated_by:ME.id,updated_at:new Date().toISOString()};
  const {error}=await sb.from('lead_finance').upsert(row,{onConflict:'lead_id'});
  if(error){toast('Could not save the contract');console.error(error);return;}
  toast('Contract saved');closeLead();renderFinance();
}
/* the customer paid ahead, so this month's follow-up is not needed */
async function skipFollowUp(id){
  const cur=$('f-follow').value;
  if(!cur){toast('Set a follow-up date first');return;}
  const next=addMonths(cur,1);
  const {error}=await sb.from('lead_finance')
    .upsert({lead_id:id,follow_up_date:next,updated_by:ME.id,updated_at:new Date().toISOString()},{onConflict:'lead_id'});
  if(error){toast('Could not move the follow-up');console.error(error);return;}
  toast('Follow-up moved to '+fmtDate(next));closeLead();renderFinance();
}
async function addPayment(id){
  const amt=$('p-amt').value;
  if(!amt){toast('Enter the amount');return;}
  const {error}=await sb.from('lead_payments').insert({lead_id:id,
    paid_on:$('p-date').value||null,amount_usd:amt,
    note:$('p-note').value.trim()||null,created_by:ME.id});
  if(error){toast('Could not add the payment');console.error(error);return;}
  /* this month is settled, so the follow-up rolls to the same day next month */
  const cur=$('f-follow')?$('f-follow').value:'';
  if(cur)await sb.from('lead_finance')
    .upsert({lead_id:id,follow_up_date:addMonths(cur,1),updated_by:ME.id,updated_at:new Date().toISOString()},{onConflict:'lead_id'});
  toast('Payment added');closeLead();renderFinance();
}
async function deletePayment(pid,leadId){
  if(!confirm('Remove this payment?'))return;
  const {error}=await sb.from('lead_payments').delete().eq('id',pid);
  if(error){toast('Could not remove it');return;}
  toast('Payment removed');closeLead();renderFinance();
}
function exportFinance(){
  downloadCSV('finance',['Ref ID','Customer','Won month','Received','Salesperson',
    'Channel','Sub-channel','System type','Panel kWp','Inverter total kW',
    'Sale value (USD)','Contract total (USD)','Contract status','Date signed','Next follow-up',
    'Other fee (USD)','Fee note',
    'Payments','Paid (USD)','Total due (USD)','Outstanding (USD)'],
    filteredFin().map(r=>[r.ref_id,r.customer_name,
      r.stage_entered_at?localDay(r.stage_entered_at).slice(0,7):'',
      localDay(r.created_at),staffName(r.assigned_to),
      r.lead_channel,r.lead_sub_channel,r.system_type,r.panel_kwp,r.inverter_kw_total,
      r.final_sale_usd,r.fin?.contract_total_usd,r.fin?.contract_status,r.fin?.contract_signed_date,
      r.fin?.follow_up_date,r.fin?.other_fee_usd,r.fin?.other_fee_note,
      r.payments.length,finPaid(r),finDue(r),finDue(r)-finPaid(r)]));
}

  toast(error?'Update failed':'Amount saved');
}
async function markPaid(id){
  const {error}=await sb.from('commissions').update({is_paid:true,paid_at:new Date().toISOString()}).eq('id',id);
  if(error){toast('Failed');return;}toast('Marked paid');renderComm();
}

/* ---------------- USERS (admin) ---------------- */
async function renderUsers(){
  const {data:users}=await sb.from('profiles').select('*').order('created_at');
  $('main').innerHTML=`
    <h2 style="margin-bottom:10px">Users</h2>
    <div class="hint"><b>Adding a new user is a two-step job:</b><br>
      1. Supabase dashboard: Authentication → Users → Add user → email + temporary password.<br>
      2. Here: fill this form to give them a CRM profile, then send them the temp password privately.</div>
    <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:720px;margin-bottom:18px">
      <div class="grid2">
        <div><label>Email (must exactly match the auth user)</label><input id="u-email"></div>
        <div><label>Staff ID</label><input id="u-staff" placeholder="e.g. ENG001"></div>
        <div><label>Full name</label><input id="u-name"></div>
        <div><label>Role</label><select id="u-role">
          <option value="marketing">marketing</option><option value="sales">sales</option>
          <option value="engineer">engineer (quotes)</option>
          <option value="site_engineer">site_engineer (installation)</option>
          <option value="finance">finance</option>
          <option value="manager">manager</option><option value="admin">admin</option></select></div>
      </div>
      <div class="modal-actions"><button class="btn-sun" onclick="createProfile()">Create profile</button></div>
    </div>
    <div class="tablewrap"><table><thead><tr>
      <th>Name</th><th>Email</th><th>Staff ID</th><th>Role</th><th>Status</th><th></th>
    </tr></thead><tbody>`+(users||[]).map(u=>`
      <tr><td><b>${esc(u.full_name)}</b></td><td>${esc(u.email)}</td><td>${esc(u.staff_id)}</td><td>${esc(u.role)}</td>
      <td>${u.is_active?'<span class="badge b-on">active</span>':'<span class="badge b-off">inactive</span>'}</td>
      <td>${u.id===ME.id?'':`<button class="btn-line" onclick="toggleUser('${u.id}',${!u.is_active})">${u.is_active?'Deactivate':'Reactivate'}</button>`}</td>
      </tr>`).join('')+`</tbody></table></div>`;
}
async function createProfile(){
  const email=$('u-email').value.trim().toLowerCase();
  const staff=$('u-staff').value.trim(),name=$('u-name').value.trim(),role=$('u-role').value;
  if(!email||!staff||!name){toast('All fields are required');return;}
  const {error}=await sb.rpc('admin_create_profile',{p_email:email,p_staff_id:staff,p_full_name:name,p_role:role});
  if(error){toast(error.message.includes('not found')?'No auth user with that email. Do step 1 first.':'Create failed');console.error(error);return;}
  toast('Profile created');renderUsers();
}
async function toggleUser(id,active){
  const {error}=await sb.from('profiles').update({is_active:active}).eq('id',id);
  if(error){toast('Failed');return;}toast(active?'User reactivated':'User deactivated');renderUsers();
}

/* ---------------- start ---------------- */
$('li-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
boot();
</script>
</body>
